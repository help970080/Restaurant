<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF7F1">
<title>Sigue tu pedido</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  :root{--ink:#1D1A16;--paper:#FBF7F1;--card:#fff;--line:#ECE4D8;--suave:#F4EEE5;--accent:#F29A1F;--accent-s:#FFF1DC;
    --rojo:#D9412F;--green:#2F8F4E;--green-s:#E8F5EC;--red:#c8472f;--muted:#8A8176;--sombra:0 6px 20px rgba(60,40,15,.08)}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px}
  .top{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
  .top img{width:46px;height:46px;border-radius:13px;object-fit:cover;box-shadow:var(--sombra);background:#fff}
  .neg{font-size:18px;font-weight:800;letter-spacing:-.2px;line-height:1.15}
  .fol{font-size:12px;color:var(--muted);margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:var(--sombra)}
  .estado{text-align:left}
  .estado .ic{width:54px;height:54px;border-radius:16px;background:var(--accent-s);display:grid;place-items:center;font-size:28px;margin-bottom:12px}
  .estado h1{font-size:24px;margin:0 0 4px;letter-spacing:-.4px;font-weight:800}
  .estado p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
  .eta{margin-top:14px;font-size:13px;font-weight:600;color:var(--muted);background:var(--suave);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px}
  .eta .rel{font-size:22px}
  .eta b{font-size:24px;display:block;line-height:1.1;color:var(--ink);font-weight:800}
  .eta-d{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
  .eta.eta-sin b{font-size:17px}
  .pasos{display:flex;gap:6px;margin:18px 0 2px}
  .paso{flex:1;text-align:center}
  .paso .dot{height:6px;border-radius:4px;background:var(--line);transition:background .4s}
  .paso.on .dot{background:var(--accent)}
  .paso.done .dot{background:var(--green)}
  .paso span{display:block;font-size:10.5px;margin-top:7px;color:var(--muted);font-weight:600;line-height:1.25}
  .paso.on span{color:var(--ink);font-weight:800}
  .mapa{padding:0;overflow:hidden}
  .mapa .hdm{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between}
  #map{height:300px;background:#e9e5db}
  .maplbl{font-size:12px;color:var(--muted);padding:10px 16px 14px}
  .rep{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:20px;padding:14px 14px 14px 14px;margin-bottom:12px;box-shadow:0 12px 28px rgba(29,26,22,.25)}
  .rep .av{width:50px;height:50px;border-radius:50%;background:#3A342D;display:grid;place-items:center;flex:none;border:2px solid var(--accent)}
  .rep .nm{font-weight:800;font-size:16px}
  .rep .rl{font-size:12px;color:#CFC6B8;margin-top:1px}
  .rep .rl .es{color:var(--accent);font-weight:700}
  .call{margin-left:auto;width:48px;height:48px;border-radius:50%;background:var(--green);color:#fff;text-decoration:none;display:grid;place-items:center;font-size:20px;flex:none;box-shadow:0 6px 16px rgba(47,143,78,.4)}
  .items{list-style:none;margin:0;padding:0}
  .items li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .items li:last-child{border:none}
  .items .q{font-weight:800;color:var(--rojo);flex:none;min-width:24px}
  .items .md{font-size:12px;color:var(--muted);margin-top:2px}
  .tot{display:flex;justify-content:space-between;margin-top:10px;padding-top:12px;border-top:1px dashed var(--line);font-weight:800;font-size:18px}
  .tot small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
  h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:700}
  .mapa h3{margin:0}
  .fin{text-align:center;padding:26px 16px}
  .fin .big{font-size:44px;line-height:1}
  .msg{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px;line-height:1.5}
  .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;animation:p 1.6s infinite}
  .vivo{font-size:11.5px;font-weight:700;color:var(--green);background:var(--green-s);padding:4px 10px;border-radius:999px}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
  .moto-ico{font-size:26px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
  .califica{text-align:center}
  .stars{display:flex;justify-content:center;gap:6px;margin:6px 0 12px}
  .st{background:none;border:none;font-size:36px;line-height:1;color:#d8d2c4;cursor:pointer;padding:0 2px;transition:color .15s,transform .15s}
  .st.on{color:var(--accent);transform:scale(1.08)}
  .st.fijo{font-size:30px;color:var(--accent);cursor:default}
  .califica textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:14px;padding:12px;font-family:inherit;font-size:14px;resize:vertical;background:var(--paper)}
  .enviar{width:100%;margin-top:10px;background:var(--rojo);color:#fff;border:none;border-radius:16px;padding:15px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px rgba(217,65,47,.28)}
  .enviar:disabled{background:#ddd6c8;cursor:not-allowed;box-shadow:none}
  .gr{margin:4px 0 0;color:var(--green);font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Cargando tu pedido…</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  var partes=location.pathname.split('/').filter(Boolean); // ['t', row, token]
  var ROW=partes[1], TOKEN=partes[2];
  var map=null, motoMk=null, yoMk=null, yo=null, ultimo=null, timer=null;
  var PASOS=[
    {t:'Pedido recibido',  s:'Ya lo tenemos. En un momento entra a la cocina.'},
    {t:'Preparándose',     s:'Tu pedido está en la cocina.'},
    {t:'Listo',            s:'Sale con el repartidor en cuanto se asigne.'},
    {t:'En camino',        s:'Tu pedido ya va para allá.'},
    {t:'Entregado',        s:'¡Buen provecho!'}
  ];
  var CORTOS=['Recibido','Cocina','Listo','En camino','Entregado'];
  var ICONOS=['🧾','👨‍🍳','📦','🛵','🎉'];
  var $=function(s){return document.querySelector(s);};
  var esc=function(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var money=function(n){return '$'+(+(n||0)).toFixed(2);};

  function pedir(){
    return fetch('/t/'+ROW+'/'+TOKEN+'/estado').then(function(r){
      if(!r.ok)throw new Error(r.status===404?'nf':'err');
      return r.json();
    });
  }
  function tick(){
    pedir().then(pintar).catch(function(e){
      if(e.message==='nf'){
        $('#app').innerHTML='<div class="msg">No encontramos este pedido.<br>Revisa la liga o pregúntanos por WhatsApp.</div>';
        return; // este sí es definitivo: no reintentar
      }
      // Falla de red: si ya hay algo pintado no se borra; si no, se avisa y se reintenta.
      if(!ultimo)$('#app').innerHTML='<div class="msg">No pudimos conectar.<br>Reintentando…</div>';
      reagendar(5000);
    });
  }
  function reagendar(d){
    if(timer)clearTimeout(timer);
    timer=setTimeout(function(){tick();},d);
  }

  function pintar(d){
    ultimo=d;
    if(d.cancelado){
      $('#app').innerHTML=cabeza(d)+'<div class="card fin"><div class="big">😔</div><h1 style="font-size:19px;margin:10px 0 4px">Tu pedido fue cancelado</h1><p style="color:var(--muted);margin:0;font-size:14px">Si crees que es un error, comunícate con nosotros.</p></div>';
      return;
    }
    var p=d.paso, info=PASOS[p];
    var h=cabeza(d);
    h+='<div class="card estado">';
    if(p===4){
      h+='<div class="big" style="font-size:40px">🎉</div>';
      h+='<h1 style="margin-top:8px">Entregado</h1><p>¡Buen provecho! Gracias por tu compra.</p>';
    }else{
      h+='<div class="ic">'+ICONOS[p]+'</div><h1>'+esc(info.t)+'</h1><p>'+esc(info.s)+'</p>';
      if(p===3){
        if(d.distanciaKm!=null&&d.distanciaKm<0.15){
          h+='<div class="eta"><span class="rel">📍</span><span>Tu repartidor<b>ya está llegando</b></span></div>';
        }else if(d.etaMin!=null){
          var mins=Math.max(1,d.etaMin);
          h+='<div class="eta"><span class="rel">⏱️</span><span>Llega aproximadamente en<b>'+mins+(mins===1?' minuto':' minutos')+'</b>'+
             (d.distanciaKm!=null?'<span class="eta-d">a '+(d.distanciaKm<1?Math.round(d.distanciaKm*1000)+' m':d.distanciaKm.toFixed(1)+' km')+' de ti</span>':'')+'</span></div>';
        }else{
          h+='<div class="eta eta-sin"><span class="rel">🛵</span><span><b>Va en camino</b><span class="eta-d">esta pantalla se actualiza sola</span></span></div>';
        }
      }
    }
    h+='<div class="pasos">';
    for(var i=0;i<5;i++)h+='<div class="paso '+(i<p?'done':(i===p?'on':''))+'"><div class="dot"></div><span>'+CORTOS[i]+'</span></div>';
    h+='</div></div>';

    if(p===4&&(d.puedeCalificar||d.calificacion)){
      h+='<div class="card califica" id="calBox">';
      if(d.calificacion){
        h+='<h3>Tu calificación</h3><div class="stars fija">'+estrellas(d.calificacion.estrellas)+'</div><p class="gr">¡Gracias por calificar!</p>';
      }else{
        h+='<h3>¿Cómo estuvo la entrega'+(d.repartidorNombre?' de '+esc(d.repartidorNombre):'')+'?</h3>'+
           '<div class="stars" id="stars">'+[1,2,3,4,5].map(function(i){return '<button class="st" data-n="'+i+'">☆</button>';}).join('')+'</div>'+
           '<textarea id="calCom" placeholder="Cuéntanos (opcional)" maxlength="300"></textarea>'+
           '<button class="enviar" id="calOk" disabled>Enviar calificación</button>';
      }
      h+='</div>';
    }
    if(d.repartidor){
      h+='<div class="rep"><div class="av"><span class="moto-ico">🛵</span></div>'+
         '<div><div class="nm">'+esc(d.repartidor.nombre)+'</div><div class="rl">Tu repartidor'+
         (d.repartidorEstrellas?' · <span class="es">★ '+(+d.repartidorEstrellas).toFixed(1)+'</span>':'')+'</div></div>'+
         (d.repartidor.telefono?'<a class="call" href="tel:'+esc(d.repartidor.telefono)+'" aria-label="Llamar">📞</a>':'')+
         '</div>';
    }
    if(p===3){
      h+='<div class="card mapa"><div class="hdm"><h3>Dónde va tu pedido</h3>'+(d.moto?'<span class="vivo"><span class="pulse"></span>En vivo</span>':'')+'</div><div id="map"></div>'+
         '<div class="maplbl" id="maplbl">'+(d.moto?'🛵 repartidor · 🔵 tú':'El repartidor aún no comparte su ubicación. El estado sí se actualiza solo.')+'</div></div>';
    }
    if(d.items&&d.items.length){
      h+='<div class="card"><h3>Tu pedido</h3><ul class="items">';
      d.items.forEach(function(it){
        h+='<li><span class="q">'+it.cantidad+'×</span><span>'+esc(it.nombre)+
           (it.modificadores&&it.modificadores.length?'<div class="md">'+esc(it.modificadores.join(' · '))+'</div>':'')+'</span></li>';
      });
      h+='</ul><div class="tot"><span>Total<small>se paga al recibir</small></span><span>'+money(d.total)+'</span></div></div>';
    }
    $('#app').innerHTML=h;
    if(p===4&&d.puedeCalificar)armarCalificacion();
    if(p===3)dibujarMapa(d);
    reagendar(p===3?8000:(p===4?60000:15000));
  }

  function estrellas(n){var o='';for(var i=1;i<=5;i++)o+='<span class="st fijo">'+(i<=n?'★':'☆')+'</span>';return o;}
  function armarCalificacion(){
    var sel=0;
    var pinta=function(){
      [].forEach.call(document.querySelectorAll('#stars .st'),function(b){
        b.textContent=(+b.dataset.n<=sel)?'★':'☆';
        b.classList.toggle('on',+b.dataset.n<=sel);
      });
      $('#calOk').disabled=!sel;
    };
    [].forEach.call(document.querySelectorAll('#stars .st'),function(b){
      b.onclick=function(){sel=+b.dataset.n;pinta();};
    });
    $('#calOk').onclick=function(){
      if(!sel)return;
      var btn=$('#calOk');btn.disabled=true;btn.textContent='Enviando…';
      fetch('/t/'+ROW+'/'+TOKEN+'/calificar',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({estrellas:sel,comentario:($('#calCom')||{}).value||''})})
        .then(function(r){return r.json();})
        .then(function(){
          $('#calBox').innerHTML='<h3>Tu calificación</h3><div class="stars fija">'+estrellas(sel)+'</div><p class="gr">¡Gracias! Nos ayuda a mejorar.</p>';
        })
        .catch(function(){btn.disabled=false;btn.textContent='Enviar calificación';});
    };
  }
  function cabeza(d){
    return '<div class="top">'+(d.logo?'<img src="'+esc(d.logo)+'" alt="">':'')+'<div><div class="neg">'+esc(d.negocio||'Tu pedido')+'</div><div class="fol">Pedido '+esc(d.folio)+(d.sucursal?' · '+esc(d.sucursal):'')+'</div></div></div>';
  }

  function dibujarMapa(d){
    var el=document.getElementById('map');
    if(!el||typeof L==='undefined')return;
    var centro=d.moto?[d.moto.lat,d.moto.lng]:(yo||[19.4326,-99.1332]);
    map=L.map(el,{zoomControl:false,attributionControl:true}).setView(centro,15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    L.control.zoom({position:'bottomright'}).addTo(map);
    var iMoto=L.divIcon({className:'',html:'<div class="moto-ico">🛵</div>',iconSize:[30,30],iconAnchor:[15,15]});
    var iYo=L.divIcon({className:'',html:'<div style="width:16px;height:16px;border-radius:50%;background:#3b6ea5;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',iconSize:[16,16],iconAnchor:[8,8]});
    if(d.moto)motoMk=L.marker([d.moto.lat,d.moto.lng],{icon:iMoto}).addTo(map);
    if(yo)yoMk=L.marker(yo,{icon:iYo}).addTo(map).bindPopup('Tú');
    encuadrar();
    if(!yo&&navigator.geolocation){
      navigator.geolocation.getCurrentPosition(function(pos){
        yo=[pos.coords.latitude,pos.coords.longitude];
        if(map){yoMk=L.marker(yo,{icon:iYo}).addTo(map).bindPopup('Tú');encuadrar();}
      },function(){},{enableHighAccuracy:false,timeout:8000,maximumAge:120000});
    }
  }
  function encuadrar(){
    if(!map)return;
    var ms=[];if(motoMk)ms.push(motoMk.getLatLng());if(yoMk)ms.push(yoMk.getLatLng());
    if(ms.length>1)map.fitBounds(L.latLngBounds(ms).pad(0.35));
    else if(ms.length===1)map.setView(ms[0],15);
  }

  if(!ROW||!TOKEN){$('#app').innerHTML='<div class="msg">Liga incompleta.</div>';return;}
  tick();
  document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});
})();
</script>
</body>
</html>
