<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF7F1">
<title>Pedir a domicilio</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Tema claro cálido: la foto de la comida manda, la marca pone el acento.
   Rojo jitomate para acciones, ámbar queso para precios y promos. */
*{box-sizing:border-box}
:root{
  --fondo:#FBF7F1; --tarjeta:#FFFFFF; --suave:#F4EEE5; --borde:#ECE4D8;
  --tinta:#1D1A16; --tenue:#8A8176; --tenue2:#B5AC9F;
  --rojo:#D9412F; --rojo2:#B8321F; --queso:#F29A1F; --queso-s:#FFF1DC; --verde:#2F8F4E; --verde-s:#E8F5EC;
  --display:"Anton","Arial Narrow",system-ui,sans-serif;
  --texto:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --sombra:0 6px 20px rgba(60,40,15,.08);
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--texto);
  -webkit-font-smoothing:antialiased;padding-bottom:110px;font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
button,select,input,textarea{font-family:inherit}

/* Encabezado */
.hd{display:flex;align-items:center;gap:12px;padding:18px 0 4px}
.hd img{width:52px;height:52px;border-radius:14px;object-fit:cover;background:#fff;box-shadow:var(--sombra);flex:none}
.hd .hola{font-size:12.5px;color:var(--tenue)}
.hd h1{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05;margin:1px 0 0;text-transform:uppercase;letter-spacing:.01em}
.hd .dir{font-size:12.5px;color:var(--tenue);margin-top:2px}
.lema{color:var(--rojo);font-size:13px;font-weight:600;margin-top:2px}

/* Buscador */
.buscar{position:relative;margin:14px 0 4px}
.buscar input{width:100%;padding:14px 16px 14px 44px;border:1px solid var(--borde);border-radius:16px;
  background:var(--tarjeta);font-size:15px;color:var(--tinta);box-shadow:var(--sombra)}
.buscar input:focus{outline:none;border-color:var(--queso)}
.buscar svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.5}

/* Banner de promoción */
.hero{position:relative;overflow:hidden;border-radius:22px;margin:16px 0 4px;padding:22px 20px;color:#fff;
  background:linear-gradient(135deg,#E2533A 0%,#C0301F 60%,#8E1C12 100%);box-shadow:0 12px 30px rgba(192,48,31,.28);min-height:132px}
.hero .tag{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
  font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.hero b{display:block;font-family:var(--display);font-weight:400;font-size:34px;line-height:1;text-transform:uppercase;margin-top:10px;max-width:62%}
.hero span{display:block;font-size:13px;opacity:.92;margin-top:6px;max-width:60%}
.hero .pz{position:absolute;right:-26px;bottom:-26px;width:170px;height:170px;border-radius:50%;overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.3);transform:rotate(-12deg)}
.hero .pz svg,.hero .pz img{width:100%;height:100%;object-fit:cover;display:block}

/* Categorías con ícono */
.cats{display:flex;gap:10px;overflow-x:auto;padding:16px 2px 12px;margin:0 -16px;padding-left:16px;padding-right:16px;
  position:sticky;top:0;z-index:5;background:var(--fondo);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:74px;padding:10px 8px 9px;
  border-radius:18px;border:1px solid var(--borde);background:var(--tarjeta);cursor:pointer;color:var(--tinta);
  transition:all .15s}
.cat .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--suave)}
.cat .tx{font-size:12px;font-weight:600;white-space:nowrap}
.cat.active{background:var(--tinta);border-color:var(--tinta);color:#fff;box-shadow:0 6px 16px rgba(29,26,22,.25)}
.cat.active .ic{background:rgba(255,255,255,.12)}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 10px}
.sec h2{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em}
.sec small{color:var(--tenue);font-size:12.5px}

/* Carrusel "Más pedidos" */
.carr{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.carr::-webkit-scrollbar{display:none}
.carr .card{flex:none;width:170px}

/* Tarjetas de producto */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{position:relative;background:var(--tarjeta);border:1px solid var(--borde);border-radius:20px;overflow:hidden;
  cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit;display:flex;flex-direction:column;box-shadow:var(--sombra);
  transition:transform .12s}
.card:active{transform:scale(.985)}
.card .im{aspect-ratio:4/3;background:var(--suave);overflow:hidden}
.card .im svg,.card .im img{width:100%;height:100%;object-fit:cover;display:block}
.card .bd{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1}
.card .nm{font-weight:800;font-size:15px;line-height:1.2}
.card .ds{font-size:12px;color:var(--tenue);margin-top:4px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px}
.card .pr{font-weight:800;font-size:16px}
.card .pr small{font-weight:600;font-size:11px;color:var(--tenue);display:block;line-height:1}
.card .mas{width:34px;height:34px;border-radius:50%;background:var(--rojo);color:#fff;display:grid;place-items:center;
  font-size:22px;line-height:1;font-weight:500;box-shadow:0 4px 10px rgba(217,65,47,.35);flex:none}
.badge{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  padding:4px 9px;border-radius:999px;background:var(--rojo);color:#fff;z-index:1}
.badge.div{background:var(--queso);color:#2B1A03}
.badge.div2{top:auto;bottom:auto;left:auto;right:10px}
.vacio{grid-column:1/-1;text-align:center;color:var(--tenue);padding:40px 10px;font-size:14px}

/* Carrito flotante (píldora) */
.bar{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(14px + env(safe-area-inset-bottom));z-index:20;pointer-events:none}
.bar .in{pointer-events:auto;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--tinta);color:#fff;
  border-radius:999px;padding:8px 8px 8px 18px;box-shadow:0 14px 34px rgba(29,26,22,.35);cursor:pointer;border:none;width:100%;font:inherit;text-align:left}
.bar .bolsa{font-size:20px}
.bar small{display:block;font-size:12.5px;font-weight:600;opacity:.85}
.bar .ahorro{color:#8FE0A8}
.bar b{margin-left:auto;background:var(--queso);color:#2B1A03;font-weight:800;font-size:17px;padding:12px 18px;border-radius:999px;white-space:nowrap}

/* Botones */
.btn{background:var(--rojo);color:#fff;border:none;border-radius:16px;padding:16px 22px;font-size:15.5px;font-weight:700;
  cursor:pointer;transition:filter .15s,transform .1s;box-shadow:0 6px 16px rgba(217,65,47,.28)}
.btn:active{transform:scale(.985)}
.btn:hover{filter:brightness(1.05)}
.btn:focus-visible{outline:3px solid var(--queso);outline-offset:2px}
.btn.full{width:100%;display:block}
.btn:disabled{background:var(--borde);color:var(--tenue);cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--tarjeta);color:var(--tinta);border:1px solid var(--borde);box-shadow:none}
.btn.dark{background:var(--tinta);box-shadow:0 6px 16px rgba(29,26,22,.25)}

/* Hoja inferior */
.ov{position:fixed;inset:0;background:rgba(29,26,22,.5);display:none;align-items:flex-end;justify-content:center;z-index:40;
  backdrop-filter:blur(2px)}
.ov.show{display:flex}
.mo{background:var(--fondo);width:100%;max-width:640px;border-radius:26px 26px 0 0;max-height:94vh;overflow:auto;
  padding:18px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -14px 50px rgba(0,0,0,.25);animation:sube .22s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.mo .asa{width:42px;height:5px;border-radius:3px;background:var(--borde);margin:0 auto 12px}
.mo h3{font-size:24px;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sub{font-size:13.5px;color:var(--tenue);line-height:1.5}
.mo.prod{padding:0 0 0}
.fot{position:relative;aspect-ratio:16/10;background:var(--suave);border-radius:26px 26px 0 0;overflow:hidden}
.fot svg,.fot img{width:100%;height:100%;object-fit:cover;display:block}
.fot .cx{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.92);
  font-size:20px;cursor:pointer;box-shadow:var(--sombra)}
.pb{padding:16px 18px 0}
.pie-hoja{position:sticky;bottom:0;background:var(--fondo);padding:14px 18px calc(16px + env(safe-area-inset-bottom));
  display:flex;gap:12px;align-items:center;border-top:1px solid var(--borde);margin-top:16px}

.grp{margin-top:18px}
.grp-t{display:flex;align-items:center;justify-content:space-between;font-size:14.5px;font-weight:800;margin-bottom:9px}
.grp-t small{font-weight:600;font-size:11.5px;color:var(--tenue);background:var(--suave);padding:3px 9px;border-radius:999px}
.grp-t small.req{color:var(--rojo2);background:#FDE9E5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--borde);background:var(--tarjeta);border-radius:14px;
  padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--tinta);transition:all .12s}
.chip .d{color:var(--tenue);font-weight:600;font-size:12.5px}
.chip.sel{background:var(--queso-s);border-color:var(--queso);color:#6A3F00}
.chip.sel .d{color:#8A5A12}
.chip:disabled{opacity:.4;cursor:not-allowed}

.f{margin-top:14px}
.f label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.f input,.f textarea,.f select{width:100%;padding:14px;background:var(--tarjeta);color:var(--tinta);
  border:1px solid var(--borde);border-radius:14px;font-size:16px;transition:border-color .15s}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--queso);outline:none}
.f input::placeholder,.f textarea::placeholder{color:var(--tenue2)}

.stp{display:flex;align-items:center;gap:4px;background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:4px;flex:none}
.stp button{width:38px;height:38px;border-radius:10px;border:none;background:var(--suave);color:var(--tinta);font-size:20px;cursor:pointer;line-height:1}
.stp b{min-width:30px;text-align:center;font-size:17px}
.stp.sm button{width:30px;height:30px;font-size:17px;border-radius:9px}
.stp.sm b{min-width:24px;font-size:15px}

/* Carrito */
.it{display:flex;gap:12px;align-items:center;padding:12px;background:var(--tarjeta);border:1px solid var(--borde);border-radius:18px;margin-top:10px}
.it .th{width:56px;height:56px;border-radius:14px;overflow:hidden;flex:none;background:var(--suave)}
.it .th svg,.it .th img{width:100%;height:100%;object-fit:cover;display:block}
.it .tx{flex:1;min-width:0}
.it .n{font-weight:700;font-size:14.5px;line-height:1.25}
.it .m{font-size:12px;color:var(--tenue);margin-top:2px}
.it .p{font-weight:800;font-size:14.5px;margin-top:4px}
.it .x{background:none;border:none;color:var(--tenue2);font-size:22px;cursor:pointer;padding:0 2px;line-height:1;align-self:flex-start}
.res{background:var(--tarjeta);border:1px solid var(--borde);border-radius:18px;padding:14px 16px;margin-top:14px}
.res .r{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;color:var(--tenue)}
.res .r.promo{color:var(--verde);font-weight:700}
.res .r.promo .m{font-size:11.5px;font-weight:500;color:var(--tenue)}
.res .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--borde);margin-top:8px;padding-top:10px;
  font-size:22px;font-weight:800;color:var(--tinta)}
.pago{display:flex;align-items:center;gap:10px;background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14px}
.pago .ic{width:36px;height:36px;border-radius:10px;background:var(--verde-s);display:grid;place-items:center;font-size:18px;flex:none}
.pago small{display:block;color:var(--tenue);font-size:12px}

.msg{font-size:13.5px;margin-top:10px;text-align:center;min-height:18px}
.msg.mal{color:var(--rojo2);font-weight:600}
.msg.bien{color:var(--verde);font-weight:600}
.cod{font-size:34px;text-align:center;letter-spacing:12px;font-weight:800}
.cod2{font-size:44px;letter-spacing:12px;text-align:center;margin:14px 0 0;color:var(--rojo);font-weight:800}

.paso{display:flex;gap:13px;align-items:flex-start;background:var(--tarjeta);border:1px solid var(--borde);border-radius:18px;
  padding:15px;margin-top:14px;opacity:.55}
.paso.activo{opacity:1;border-color:var(--queso);box-shadow:var(--sombra)}
.paso.hecho{opacity:.85;border-color:var(--verde)}
.pn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--queso);color:#2B1A03;display:grid;place-items:center;font-weight:800;font-size:14px}
.paso.hecho .pn{background:var(--verde);color:#fff}
.paso b{font-size:15.5px}
.pd{font-size:12.5px;color:var(--tenue);margin-top:4px;line-height:1.45}

.aviso{background:var(--queso-s);border-radius:14px;padding:12px 14px;font-size:13.5px;margin-top:14px;line-height:1.5;color:#6A4A1A}
.aviso.ok{background:var(--verde-s);color:#1F5E34}
.aviso b{color:inherit}

/* Cierre */
.ok{text-align:center;padding:48px 16px}
.ok .big{width:96px;height:96px;border-radius:50%;background:var(--queso-s);display:grid;place-items:center;font-size:48px;margin:0 auto}
.ok h2{font-size:28px;font-weight:800;margin:18px 0 8px;letter-spacing:-.02em}
.ok p{color:var(--tenue);font-size:14.5px;line-height:1.6;margin:0}
.ok .folio{display:inline-block;font-weight:800;font-size:15px;color:var(--tinta);background:var(--tarjeta);border:1px solid var(--borde);
  padding:6px 14px;border-radius:999px;margin-bottom:10px}
.ok a{display:inline-block;margin-top:24px;background:var(--rojo);color:#fff;text-decoration:none;padding:16px 30px;border-radius:16px;
  font-weight:700;font-size:15px;box-shadow:0 8px 22px rgba(217,65,47,.3)}
.pie{text-align:center;color:var(--tenue);font-size:12.5px;padding:30px 16px 10px;line-height:1.7}

@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg" style="padding:70px 16px">Poniendo el horno a temperatura…</div></div>
<div class="bar" id="bar" style="display:none"><button class="in" id="barB">
  <span class="bolsa">🛍️</span>
  <span><small id="barN">0 productos</small><span style="font-weight:700">Ver mi pedido</span></span>
  <b id="barT">$0.00</b>
</button></div>
<div class="ov" id="ov"><div class="mo" id="mo"></div></div>
<script>

<script>
/* Pizza generada a partir de la descripción del producto.
   Cada pizza lleva los ingredientes que dice su descripción, colocados con una
   semilla fija (el id del producto): la misma pizza siempre se ve igual, y dos
   pizzas distintas nunca se ven idénticas. */
(function(){
  function semilla(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var CX=100,CY=100;
  // Puntos repartidos sobre el queso sin amontonarse
  function puntos(r,n,rmax,sep){
    var out=[],intentos=0;
    while(out.length<n&&intentos<n*40){intentos++;
      var a=r()*Math.PI*2,d=Math.sqrt(r())*rmax,x=CX+Math.cos(a)*d,y=CY+Math.sin(a)*d,ok=true;
      for(var i=0;i<out.length;i++){var dx=out[i][0]-x,dy=out[i][1]-y;if(dx*dx+dy*dy<sep*sep){ok=false;break;}}
      if(ok)out.push([x,y]);}
    return out;
  }
  var T={
    pepperoni:function(x,y,r,u){var s=9+r()*2;return '<g filter="url(#sh'+u+')"><circle cx="'+x+'" cy="'+y+'" r="'+s+'" fill="#b3261e"/><circle cx="'+x+'" cy="'+y+'" r="'+(s-1.6)+'" fill="#c93a2b"/>'+
      '<circle cx="'+(x-2)+'" cy="'+(y-2)+'" r="1.4" fill="#8e1a14" opacity=".7"/><circle cx="'+(x+3)+'" cy="'+(y+1)+'" r="1.1" fill="#8e1a14" opacity=".6"/><circle cx="'+(x-1)+'" cy="'+(y+3)+'" r="1" fill="#f0a08a" opacity=".6"/>'+
      '<path d="M'+(x-s+2)+' '+(y-2)+'a'+(s-2)+' '+(s-2)+' 0 0 1 '+(s*.8)+' '+(-s*.55)+'" stroke="#e36a55" stroke-width="1.2" fill="none" opacity=".6"/></g>';},
    jamon:function(x,y,r,u){var w=11+r()*4,a=r()*90;return '<rect x="'+(x-w/2)+'" y="'+(y-w/2)+'" width="'+w+'" height="'+(w*.8)+'" rx="2" fill="#f2a7a0" stroke="#e38b83" stroke-width="1" transform="rotate('+a+' '+x+' '+y+')" filter="url(#sh'+u+')"/>';},
    pina:function(x,y,r,u){var a=r()*360;return '<path d="M'+x+' '+y+'l9 -3l-2 9z" fill="#f7d34a" stroke="#e0b02a" stroke-width=".8" transform="rotate('+a+' '+x+' '+y+')" filter="url(#sh'+u+')"/>';},
    champinon:function(x,y,r,u){var a=r()*360;return '<g transform="rotate('+a+' '+x+' '+y+')" filter="url(#sh'+u+')"><path d="M'+(x-8)+' '+y+'a8 7 0 0 1 16 0z" fill="#e9dcc4" stroke="#b9a584" stroke-width="1"/><rect x="'+(x-2.5)+'" y="'+y+'" width="5" height="6" rx="1.5" fill="#dccdb1" stroke="#b9a584" stroke-width=".8"/></g>';},
    jalapeno:function(x,y,r,u){var s=5+r()*1.5;return '<g filter="url(#sh'+u+')"><circle cx="'+x+'" cy="'+y+'" r="'+s+'" fill="#3f8a2e"/><circle cx="'+x+'" cy="'+y+'" r="'+(s-2)+'" fill="#a9d27a"/><circle cx="'+(x+1)+'" cy="'+y+'" r=".9" fill="#f3f0d0"/><circle cx="'+(x-1)+'" cy="'+(y+1)+'" r=".9" fill="#f3f0d0"/></g>';},
    cebolla:function(x,y,r,u,morada){var a=r()*360,c=morada?'#9b3f86':'#f4efe6';return '<path d="M'+(x-7)+' '+y+'a7 7 0 0 1 14 0" stroke="'+c+'" stroke-width="2.2" fill="none" opacity=".9" transform="rotate('+a+' '+x+' '+y+')"/>';},
    carne:function(x,y,r,u,col){var c=col||'#6b3a1f',p='';for(var i=0;i<5;i++){var a=i/5*Math.PI*2,d=4+r()*3;p+=(i?'L':'M')+(x+Math.cos(a)*d).toFixed(1)+' '+(y+Math.sin(a)*d).toFixed(1);}
      return '<path d="'+p+'z" fill="'+c+'" stroke="rgba(0,0,0,.25)" stroke-width=".8" filter="url(#sh'+u+')"/>';},
    tocino:function(x,y,r,u){var a=r()*180;return '<g transform="rotate('+a+' '+x+' '+y+')" filter="url(#sh'+u+')"><rect x="'+(x-9)+'" y="'+(y-3)+'" width="18" height="6" rx="2.5" fill="#9c3b2a"/><rect x="'+(x-9)+'" y="'+(y-.8)+'" width="18" height="1.6" fill="#f0c7a8" opacity=".8"/></g>';},
    aguacate:function(x,y,r,u){var a=r()*360;return '<g transform="rotate('+a+' '+x+' '+y+')" filter="url(#sh'+u+')"><ellipse cx="'+x+'" cy="'+y+'" rx="9" ry="4.5" fill="#2f5d1e"/><ellipse cx="'+x+'" cy="'+y+'" rx="7.8" ry="3.5" fill="#b8d67a"/><ellipse cx="'+(x+1)+'" cy="'+y+'" rx="5" ry="2.2" fill="#dbe9a5"/></g>';},
    frijol:function(x,y,r,u){return '<ellipse cx="'+x+'" cy="'+y+'" rx="3" ry="2.1" fill="#4a2a1a" transform="rotate('+(r()*180)+' '+x+' '+y+')"/>';},
    aceituna:function(x,y,r,u){return '<g><circle cx="'+x+'" cy="'+y+'" r="4" fill="#1f1a17"/><circle cx="'+x+'" cy="'+y+'" r="1.7" fill="#6b5b4c"/></g>';},
    pimiento:function(x,y,r,u){var a=r()*360;return '<path d="M'+(x-7)+' '+y+'q7 -5 14 0" stroke="#2f7d32" stroke-width="3" fill="none" stroke-linecap="round" transform="rotate('+a+' '+x+' '+y+')"/>';},
    chile:function(x,y,r,u){var a=r()*360;return '<path d="M'+(x-6)+' '+y+'q6 -3 12 0" stroke="#b01c10" stroke-width="2.4" fill="none" stroke-linecap="round" transform="rotate('+a+' '+x+' '+y+')"/>';},
    elote:function(x,y,r,u){return '<rect x="'+(x-2)+'" y="'+(y-2)+'" width="4" height="4" rx="1.2" fill="#f5c842" stroke="#d9a72a" stroke-width=".5"/>';},
    albahaca:function(x,y,r,u){var a=r()*360;return '<path d="M'+x+' '+y+'q5 -7 10 0q-5 7 -10 0z" fill="#2e7d32" opacity=".9" transform="rotate('+a+' '+x+' '+y+')"/>';}
  };
  // Qué ingredientes lleva, leyendo nombre + descripción
  function ingredientes(txt){
    var t=(txt||'').toLowerCase(),L=[];
    function si(re,k,n,extra){if(re.test(t))L.push({k:k,n:n,x:extra});}
    si(/pepperoni|peperoni|salami/,'pepperoni',10);
    si(/jam[oó]n/,'jamon',9);
    si(/pi[ñn]a/,'pina',10);
    si(/champi|hongo/,'champinon',8);
    si(/jalape/,'jalapeno',9);
    si(/cebolla morada/,'cebolla',7,true); if(!/cebolla morada/.test(t))si(/cebolla/,'cebolla',7,false);
    si(/pastor/,'carne',14,'#b5461f');
    si(/arrachera|res|carne|chupacabra|mexicana|carnes/,'carne',12,'#5e321a');
    si(/pollo|pechuga|pierna/,'carne',11,'#d9b27c');
    si(/chorizo/,'carne',12,'#8f2f1c');
    si(/tocino|bacon/,'tocino',6);
    si(/aguacate/,'aguacate',5);
    si(/frijol/,'frijol',18);
    si(/aceituna/,'aceituna',8);
    si(/pimiento/,'pimiento',7);
    si(/chile de [aá]rbol|chipotle|chile/,'chile',7);
    si(/elote|ma[ií]z/,'elote',20);
    si(/albahaca|margarita|italiana/,'albahaca',6);
    if(!L.length&&!/queso|cheese|4 quesos|3 quesos/.test(t))L.push({k:'pepperoni',n:10}); // sin pistas: la clásica
    return L;
  }
  var UID=0;
  window.pizzaSVG=function(p){
    var u=++UID, txt=(p.nombre||'')+' '+(p.descripcion||''), r=rng(semilla(p.id||txt));
    var bbq=/bbq/i.test(txt), quesos=/queso|cheese/i.test(txt);
    var salsa=bbq?'#6a2a14':'#c7401f';
    var s='<svg viewBox="0 0 200 150" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">'+
      '<defs>'+
      '<radialGradient id="mesa'+u+'" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#f7ead6"/><stop offset="1" stop-color="#e3cba6"/></radialGradient>'+
      '<radialGradient id="orilla'+u+'" cx="45%" cy="40%" r="60%"><stop offset=".78" stop-color="#e2a557"/><stop offset=".93" stop-color="#c77f2e"/><stop offset="1" stop-color="#9c5a1d"/></radialGradient>'+
      '<radialGradient id="queso'+u+'" cx="42%" cy="38%" r="65%"><stop offset="0" stop-color="#fde6a4"/><stop offset=".7" stop-color="#f6cf6b"/><stop offset="1" stop-color="#e9ae45"/></radialGradient>'+
      '<filter id="tx'+u+'"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="'+(u%50)+'"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .35  0 0 0 0 .1  0 0 0 .35 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>'+
      '<filter id="sh'+u+'" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx=".6" dy="1.2" stdDeviation=".9" flood-color="#5a2a0a" flood-opacity=".45"/></filter>'+
      '<filter id="gr'+u+'" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3a220c" flood-opacity=".35"/></filter>'+
      '</defs>'+
      '<rect width="200" height="150" fill="url(#mesa'+u+')"/>'+
      // tabla de madera
      '<g transform="translate(100,75) scale(.9) translate(-100,-100)">'+
      '<circle cx="'+CX+'" cy="'+CY+'" r="74" fill="#b07a45" filter="url(#gr'+u+')"/>'+
      '<circle cx="'+CX+'" cy="'+CY+'" r="74" fill="none" stroke="#8c5a2c" stroke-width="2"/>'+
      '<circle cx="'+CX+'" cy="'+CY+'" r="66" fill="url(#orilla'+u+')"/>'+
      '<circle cx="'+CX+'" cy="'+CY+'" r="66" fill="#000" filter="url(#tx'+u+')" opacity=".6"/>';
    // quemaditos de horno en la orilla
    for(var i=0;i<14;i++){var a=r()*Math.PI*2,d=60+r()*4;s+='<ellipse cx="'+(CX+Math.cos(a)*d).toFixed(1)+'" cy="'+(CY+Math.sin(a)*d).toFixed(1)+'" rx="'+(2+r()*3).toFixed(1)+'" ry="'+(1+r()*1.5).toFixed(1)+'" fill="#6e3a12" opacity="'+(.35+r()*.35).toFixed(2)+'" transform="rotate('+(a*57.3).toFixed(0)+' '+(CX+Math.cos(a)*d).toFixed(1)+' '+(CY+Math.sin(a)*d).toFixed(1)+')"/>';}
    // salsa asomando y queso derretido con borde irregular
    s+='<circle cx="'+CX+'" cy="'+CY+'" r="56" fill="'+salsa+'"/>';
    var path='';for(var k=0;k<=36;k++){var aa=k/36*Math.PI*2,rr=50+r()*5;path+=(k?'L':'M')+(CX+Math.cos(aa)*rr).toFixed(1)+' '+(CY+Math.sin(aa)*rr).toFixed(1);}
    s+='<path d="'+path+'z" fill="url(#queso'+u+')"/>';
    s+='<path d="'+path+'z" fill="#000" filter="url(#tx'+u+')" opacity=".5"/>';
    // gratinado: manchitas doradas
    var nG=quesos?26:16;for(var g=0;g<nG;g++){var pt=puntos(r,1,46,0)[0];s+='<ellipse cx="'+pt[0].toFixed(1)+'" cy="'+pt[1].toFixed(1)+'" rx="'+(2+r()*4).toFixed(1)+'" ry="'+(1.5+r()*3).toFixed(1)+'" fill="#d98b2b" opacity="'+(.25+r()*.35).toFixed(2)+'"/>';}
    // salsa asomando entre el queso
    if(!quesos)for(var q=0;q<6;q++){var pq=puntos(r,1,44,0)[0];s+='<circle cx="'+pq[0].toFixed(1)+'" cy="'+pq[1].toFixed(1)+'" r="'+(1.5+r()*2).toFixed(1)+'" fill="'+salsa+'" opacity=".55"/>';}
    if(bbq){s+='<path d="M60 85 q20 -12 40 0 t40 0 M62 110 q20 -12 40 0 t36 0" stroke="#5a200c" stroke-width="3" fill="none" stroke-linecap="round" opacity=".75"/>';}
    // ingredientes
    var L=ingredientes(txt);
    L.forEach(function(it){
      var n=Math.max(4,Math.round(it.n*(L.length>3?.7:1)));
      puntos(r,n,43,it.k==='frijol'||it.k==='elote'?5:9).forEach(function(pt){s+=T[it.k](Math.round(pt[0]*10)/10,Math.round(pt[1]*10)/10,r,u,it.x);});
    });
    // cortes de rebanada y brillo
    s+='<g stroke="#b77322" stroke-width="1" opacity=".35">';
    for(var c=0;c<4;c++){var ac=c*Math.PI/4+.2;s+='<line x1="'+(CX+Math.cos(ac)*62).toFixed(1)+'" y1="'+(CY+Math.sin(ac)*62).toFixed(1)+'" x2="'+(CX-Math.cos(ac)*62).toFixed(1)+'" y2="'+(CY-Math.sin(ac)*62).toFixed(1)+'"/>';}
    s+='</g><ellipse cx="'+(CX-18)+'" cy="'+(CY-22)+'" rx="26" ry="14" fill="#fff" opacity=".10" transform="rotate(-30 '+(CX-18)+' '+(CY-22)+')"/>';
    s+='</g></svg>';
    return s;
  };

  // Íconos de categoría: dibujo propio, mismo trazo para todos (no emojis)
  var I={
    pizza:'<path d="M12 3c4.5 0 8.3 1.6 10 3.6L12 29 2 6.6C3.7 4.6 7.5 3 12 3z" fill="#F6C65B" stroke="#C7771F" stroke-width="1.6" stroke-linejoin="round"/><path d="M2.8 6.4C4.8 4.5 8.2 3.3 12 3.3s7.2 1.2 9.2 3.1" stroke="#C7771F" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="9" cy="11" r="2" fill="#C8372A"/><circle cx="14.5" cy="13.5" r="1.8" fill="#C8372A"/><circle cx="11.5" cy="19" r="1.6" fill="#C8372A"/><path d="M15 9.5l2 .6" stroke="#3F7D3A" stroke-width="1.4" stroke-linecap="round"/>',
    bebida:'<path d="M7 9h14l-1.6 17.2a2 2 0 0 1-2 1.8h-6.8a2 2 0 0 1-2-1.8z" fill="#E1503C" stroke="#A8301F" stroke-width="1.5" stroke-linejoin="round"/><rect x="6" y="6.5" width="16" height="3" rx="1.2" fill="#F4EFE6" stroke="#A8301F" stroke-width="1.3"/><path d="M15.5 6.5l2-5" stroke="#1D1A16" stroke-width="1.6" stroke-linecap="round"/><path d="M9 15h10" stroke="#fff" stroke-width="1.6" opacity=".7" stroke-linecap="round"/>',
    papas:'<g stroke="#C7881F" stroke-width="1"><rect x="8" y="4" width="3" height="13" rx="1" fill="#F7CF5C"/><rect x="12.5" y="2.5" width="3" height="14" rx="1" fill="#F7CF5C"/><rect x="17" y="4.5" width="3" height="12" rx="1" fill="#F7CF5C"/></g><path d="M6 12h16l-1.8 14.3a2 2 0 0 1-2 1.7H9.8a2 2 0 0 1-2-1.7z" fill="#D9412F" stroke="#A8301F" stroke-width="1.5" stroke-linejoin="round"/><path d="M11 18.5a3 3 0 0 0 6 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>',
    gorro:'<path d="M8 17c-3.5 0-5-2.6-5-5a5 5 0 0 1 6-4.9A6 6 0 0 1 20 7a5 5 0 1 1 1 10z" fill="#fff" stroke="#1D1A16" stroke-width="1.6" stroke-linejoin="round"/><rect x="8" y="17" width="13" height="7" rx="1.5" fill="#F4EEE5" stroke="#1D1A16" stroke-width="1.6"/><path d="M11.5 17v7M17.5 17v7" stroke="#1D1A16" stroke-width="1.2"/>',
    caja:'<path d="M3 11l11-5 11 5v11l-11 5-11-5z" fill="#E7B574" stroke="#9C6A2E" stroke-width="1.5" stroke-linejoin="round"/><path d="M3 11l11 5 11-5M14 16v11" stroke="#9C6A2E" stroke-width="1.5" fill="none"/><circle cx="9" cy="17.5" r="2.4" fill="#D9412F"/>',
    estrella:'<path d="M14 3.5l3.2 6.6 7.2 1-5.2 5.1 1.2 7.2L14 20l-6.4 3.4 1.2-7.2-5.2-5.1 7.2-1z" fill="#F6B73C" stroke="#C7771F" stroke-width="1.5" stroke-linejoin="round"/>',
    postre:'<path d="M5 15h18v7a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" fill="#F2C9A0" stroke="#A86B3C" stroke-width="1.5"/><path d="M5 15c0-4 4-7 9-7s9 3 9 7" fill="#F7E3EE" stroke="#A86B3C" stroke-width="1.5"/><circle cx="14" cy="6" r="2.3" fill="#D9412F"/>',
    plato:'<circle cx="14" cy="15" r="10" fill="#fff" stroke="#1D1A16" stroke-width="1.6"/><circle cx="14" cy="15" r="6" fill="#F4EEE5" stroke="#1D1A16" stroke-width="1.2"/>'
  };
  window.iconoCatSVG=function(nombre,pizzeria){
    var n=(nombre||'').toLowerCase(),k;
    if(/bebida|refresco|agua/.test(n))k='bebida';
    else if(/acompa|entrada|botana|papa/.test(n))k='papas';
    else if(/postre|dulce|pay|pastel/.test(n))k='postre';
    else if(/grande|familiar|mega|formato|combo|paquete/.test(n))k='caja';
    else if(/gourmet|premium/.test(n))k='gorro';
    else if(/especialidad/.test(n))k='pizza';
    else if(/especial/.test(n))k='estrella';
    else k=(pizzeria||/pizza/.test(n))?'pizza':'plato';
    return '<svg viewBox="0 0 28 30" width="26" height="28" xmlns="http://www.w3.org/2000/svg">'+I[k]+'</svg>';
  };
})();

</script>
<script>
(function(){
  var partes=location.pathname.split('/').filter(Boolean); // ['pedir', row, suc]
  var ROW=partes[1], SUC=partes[2];
  var M=null, cat=null, carrito=[], tel='', token='', datos={}, q='';
  var $=function(s){return document.querySelector(s);};
  var ov=$('#ov'), mo=$('#mo');
  var esc=function(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var money=function(n){return '$'+(+(n||0)).toFixed(2);};
  var cerrar=function(){ov.classList.remove('show');mo.className='mo';};
  ov.onclick=function(e){if(e.target===ov)cerrar();};

  fetch('/pedir/'+ROW+'/'+SUC+'/menu').then(function(r){
    if(!r.ok)throw new Error('no disponible');return r.json();
  }).then(function(d){M=d;cat=(d.categorias[0]||{}).id;pintar();})
   .catch(function(){$('#app').innerHTML='<div class="msg mal" style="padding:70px 16px">No cargó el menú. Revisa tu conexión y vuelve a intentar.</div>';});

  // ---- Imagen de cada producto: su foto o una ilustración según lo que es ----
  function catNombre(id){var c=M.categorias.find(function(x){return x.id===id;});return c?c.nombre:'';}
  function esPizzeria(){return /pizz/i.test(M.negocio||'')||M.categorias.some(function(c){return /pizz/i.test(c.nombre);});}
  function arte(p){
    var n=(p.nombre||'').toLowerCase(), c=catNombre(p.categoriaId).toLowerCase(), pz=esPizzeria();
    if(/agua|limonada|jamaica|horchata/.test(n))return artAgua();
    if(/refresco|soda|coca|bebida/.test(n)||c.indexOf('bebida')>=0)return artSoda();
    if(/pizza|peperoni|pepperoni|mega|barra/.test(n)||c.indexOf('pizza')>=0)return pizzaSVG(p);
    if(/spaghetti|espagueti|pasta|lasa/.test(n)||c.indexOf('pasta')>=0)return artPasta();
    if(/papa|fries|aro|nugget|alita|dedo|pan de ajo/.test(n)||c.indexOf('acompa')>=0)return artFries();
    if(!pz&&/hamburg|burger/.test(n))return artBurger();
    return pz?pizzaSVG(p):artPlato();
  }
  function img(p){
    if(p&&p.foto)return '<img src="'+esc(p.foto)+'" alt="'+esc(p.nombre)+'" loading="lazy" onerror="this.replaceWith(document.createRange().createContextualFragment(window.__arte(\''+p.id+'\')))">';
    return p?arte(p):artPlato();
  }
  window.__arte=function(id){var p=M.productos.find(function(x){return x.id===id;});return p?arte(p):artPlato();};
  function icono(nombre){
    var n=(nombre||'').toLowerCase();
    if(/bebida|refresco|agua/.test(n))return '🥤';
    if(/acompa|entrada|botana|papa/.test(n))return '🍟';
    if(/postre|dulce|pay|pastel/.test(n))return '🍰';
    if(/grande|familiar|mega|formato/.test(n))return '📦';
    if(/gourmet|premium/.test(n))return '👨‍🍳';
    if(/especial/.test(n))return '⭐';
    if(/pasta|espagueti/.test(n))return '🍝';
    if(/hambur|burger/.test(n))return '🍔';
    if(/ensalada|veg/.test(n))return '🥗';
    if(/combo|paquete/.test(n))return '🎁';
    if(/pizza/.test(n))return '🍕';
    return esPizzeria()?'🍕':'🍽️';
  }
  // Precio "desde": si hay tamaños obligatorios, lo mínimo que se puede pagar
  function desde(p){
    var t=p.precioBase, hay=false;
    (p.gruposIds||[]).forEach(function(gid){
      var g=M.grupos.find(function(x){return x.id===gid;});if(!g)return;
      if(g.opciones.some(function(o){return o.precioDelta;}))hay=true;
      if(g.obligatorio&&g.opciones.length)t+=Math.min.apply(null,g.opciones.map(function(o){return o.precioDelta||0;}));
    });
    return {monto:t,desde:hay};
  }
  var MAS=function(){return M.masPedidos||[];};
  function tarjeta(p){
    var maxP=p.divisible?Math.min(4,Math.max(2,+p.divisible.maxPartes||2)):0;
    var pr=desde(p), top=MAS().indexOf(p.id)>=0;
    return '<button class="card" data-p="'+p.id+'">'+
      (top?'<span class="badge">Más pedido</span>':'')+
      (maxP?'<span class="badge div'+(top?' div2':'')+'">'+maxP+' sabores</span>':'')+
      '<span class="im">'+img(p)+'</span>'+
      '<span class="bd"><span class="nm">'+esc(p.nombre)+'</span>'+
      (p.descripcion?'<span class="ds">'+esc(p.descripcion)+'</span>':'')+
      '<span class="ft"><span class="pr">'+(pr.desde?'<small>desde</small>':'')+money(pr.monto)+'</span><span class="mas">+</span></span></span></button>';
  }

  // La cabecera y el buscador se pintan una vez; al escribir solo cambia el
  // cuerpo, para que el teclado del teléfono no se cierre en cada letra.
  function pintar(){
    if(M.negocio)document.title=M.negocio+' · Pedir a domicilio';
    $('#app').innerHTML=
      '<div class="hd">'+(M.logo?'<img src="'+esc(M.logo)+'" alt="">':'')+
        '<div><div class="hola">¡Hola! 👋 ¿Qué se te antoja hoy?</div><h1>'+esc(M.negocio)+'</h1>'+
        '<div class="dir">📍 Entregamos en '+esc(M.sucursal.nombre)+' y alrededores</div>'+
        (M.lema?'<div class="lema">'+esc(M.lema)+'</div>':'')+'</div></div>'+
      '<div class="buscar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'+
        '<input id="q" type="search" placeholder="Busca tu pizza favorita…" autocomplete="off"></div>'+
      '<div id="cuerpo"></div>'+
      '<div class="pie">'+(M.horario?'🕒 '+esc(M.horario)+'<br>':'')+'💵 Pagas al recibir</div>';
    $('#q').oninput=function(){q=this.value;cuerpo();};
    cuerpo();barra();
  }
  function cuerpo(){
    var buscando=q.trim().length>=2, t=q.trim().toLowerCase();
    var ps=buscando
      ? M.productos.filter(function(p){return (p.nombre+' '+(p.descripcion||'')).toLowerCase().indexOf(t)>=0;})
      : M.productos.filter(function(p){return p.categoriaId===cat;});
    var tops=MAS().map(function(id){return M.productos.find(function(p){return p.id===id;});}).filter(Boolean);
    var enPromo=function(p){return M.promo2x1&&(M.promo2x1.categorias||[]).indexOf(p.categoriaId)>=0;};
    var heroPz=M.productos.find(function(p){return p.foto&&enPromo(p);})||M.productos.find(enPromo)
      ||M.productos.find(function(p){return /pizza/i.test(catNombre(p.categoriaId)+' '+p.nombre);})||M.productos[0];
    $('#cuerpo').innerHTML=
      (M.promo2x1&&!buscando?'<div class="hero"><span class="tag">Promoción</span><b>'+esc(M.promo2x1.nombre)+'</b>'+
        '<span>Pide dos y la más barata va por nuestra cuenta. Se aplica solo.</span>'+
        '<div class="pz">'+img(heroPz)+'</div></div>':'')+
      (buscando?'':'<div class="cats">'+M.categorias.map(function(c){
        return '<button class="cat '+(c.id===cat?'active':'')+'" data-c="'+c.id+'"><span class="ic">'+iconoCatSVG(c.nombre,esPizzeria())+'</span><span class="tx">'+esc(c.nombre)+'</span></button>';}).join('')+'</div>')+
      (!buscando&&tops.length?'<div class="sec"><h2>🔥 Los más pedidos</h2><small>últimos 30 días</small></div><div class="carr">'+tops.map(tarjeta).join('')+'</div>':'')+
      '<div class="sec" id="secLista"><h2>'+(buscando?'Resultados':esc(catNombre(cat)))+'</h2><small>'+ps.length+' producto'+(ps.length===1?'':'s')+'</small></div>'+
      '<div class="grid">'+(ps.length?ps.map(tarjeta).join(''):'<div class="vacio">'+(buscando?'No encontramos “'+esc(q)+'”.':'Sin productos en esta categoría.')+'</div>')+'</div>';
    [].forEach.call(document.querySelectorAll('[data-c]'),function(b){b.onclick=function(){
      cat=b.dataset.c;var x=window.scrollX,y=window.scrollY;cuerpo();window.scrollTo(x,y);
      var cs=$('.cats'),act=$('.cat.active');if(cs&&act)cs.scrollLeft=act.offsetLeft-16;};});
    [].forEach.call(document.querySelectorAll('[data-p]'),function(b){b.onclick=function(){abrirProducto(b.dataset.p);};});
  }

  var ETIQ={1:'Entera',2:'Mitad y mitad',3:'En tres',4:'En cuatro'};
  function saboresPara(p){
    var ex=(p.divisible&&p.divisible.excluirCategorias)||[];
    return M.productos.filter(function(x){
      return x.id!==p.id && !x.divisible && ex.indexOf(x.categoriaId)<0;
    }).sort(function(a,b){return a.nombre.localeCompare(b.nombre);});
  }
  // Grupo de varias opciones (extras): se pueden elegir varias, hasta su máximo.
  var multi=function(g){return g.tipo&&g.tipo!=='unico';};
  function abrirProducto(id){
    var p=M.productos.find(function(x){return x.id===id;});
    var grupos=(p.gruposIds||[]).map(function(g){return M.grupos.find(function(x){return x.id===g;});}).filter(Boolean);
    var sel={}, cant=1;
    var div=p.divisible||null;
    var maxP=div?Math.min(4,Math.max(2,+div.maxPartes||2)):1;
    var nPartes=1, partes=[];
    var opcSab=div?saboresPara(p):[];
    grupos.forEach(function(g){
      if(multi(g)){sel[g.id]=[];return;}
      var o=g.opciones[0];if(g.obligatorio&&o)sel[g.id]=o.id;
    });
    function elegidas(g){
      var v=sel[g.id];var ids=multi(g)?(v||[]):(v?[v]:[]);
      return g.opciones.filter(function(o){return ids.indexOf(o.id)>=0;});
    }
    function unit(){
      var t=p.precioBase;
      grupos.forEach(function(g){elegidas(g).forEach(function(o){t+=o.precioDelta||0;});});
      return t;
    }
    function precio(){return unit()*cant;}
    function render(){
      var notaPrev=$('#pn')?$('#pn').value:'';
      mo.className='mo prod';
      mo.innerHTML='<div class="fot">'+img(p)+'<button class="cx" id="cx" aria-label="Cerrar">×</button></div><div class="pb">'+
        '<h3>'+esc(p.nombre)+'</h3>'+(p.descripcion?'<div class="sub">'+esc(p.descripcion)+'</div>':'')+
        (div?'<div class="grp"><div class="grp-t">¿Cómo la quieres?<small>mismo precio</small></div>'+
          '<div class="chips">'+[1,2,3,4].slice(0,maxP).map(function(k){
            return '<button class="chip '+(nPartes===k?'sel':'')+'" data-np="'+k+'">'+ETIQ[k]+'</button>';}).join('')+'</div>'+
          (nPartes>1?Array.apply(null,{length:nPartes}).map(function(_,i){
            return '<div class="f"><label>Parte '+(i+1)+'</label><select class="ps" data-i="'+i+'">'+
              '<option value="">— elige el sabor —</option>'+
              opcSab.map(function(o){return '<option value="'+o.id+'" '+(partes[i]===o.id?'selected':'')+'>'+esc(o.nombre)+'</option>';}).join('')+
              '</select></div>';}).join(''):'')+'</div>':'')+
        grupos.map(function(g){
          var m=multi(g), n=m?(sel[g.id]||[]).length:0, lleno=m&&g.max&&n>=g.max;
          return '<div class="grp"><div class="grp-t">'+esc(g.nombre)+
            (g.obligatorio?'<small class="req">Obligatorio</small>':(m&&g.max?'<small>hasta '+g.max+'</small>':'<small>Opcional</small>'))+'</div><div class="chips">'+
            g.opciones.map(function(o){
              var on=m?(sel[g.id]||[]).indexOf(o.id)>=0:sel[g.id]===o.id;
              return '<button class="chip '+(on?'sel':'')+'" data-g="'+g.id+'" data-o="'+o.id+'"'+(lleno&&!on?' disabled':'')+'>'+(on&&m?'✓ ':'')+esc(o.nombre)+
                (o.precioDelta?'<span class="d">+'+money(o.precioDelta)+'</span>':'')+'</button>';}).join('')+'</div></div>';}).join('')+
        '<div class="f"><label>¿Algo especial?</label><input id="pn" placeholder="Sin cebolla, bien cocida…" maxlength="80" value="'+esc(notaPrev)+'"></div>'+
        '</div><div class="pie-hoja"><div class="stp"><button id="me">−</button><b id="cn">'+cant+'</b><button id="ma">+</button></div>'+
        '<button class="btn full" id="add" style="flex:1">Agregar · '+money(precio())+'</button></div>';
      $('#cx').onclick=cerrar;
      [].forEach.call(mo.querySelectorAll('[data-o]'),function(el){el.onclick=function(){
        var g=M.grupos.find(function(x){return x.id===el.dataset.g;}), o=el.dataset.o;
        if(multi(g)){
          var a=sel[g.id]||(sel[g.id]=[]), i=a.indexOf(o);
          if(i>=0)a.splice(i,1);else if(!g.max||a.length<g.max)a.push(o);
        }else sel[g.id]=(sel[g.id]===o&&!g.obligatorio)?null:o;
        render();};});
      [].forEach.call(mo.querySelectorAll('[data-np]'),function(b){b.onclick=function(){
        nPartes=+b.dataset.np;partes=partes.slice(0,nPartes);render();};});
      [].forEach.call(mo.querySelectorAll('.ps'),function(s2){s2.onchange=function(){partes[+s2.dataset.i]=s2.value;};});
      $('#me').onclick=function(){if(cant>1){cant--;render();}};
      $('#ma').onclick=function(){if(cant<20){cant++;render();}};
      $('#add').onclick=function(){
        var falta=grupos.find(function(g){return g.obligatorio&&!elegidas(g).length;});
        if(falta){alert('Elige '+falta.nombre);return;}
        var trozos=null;
        if(div&&nPartes>1){
          trozos=partes.slice(0,nPartes).filter(Boolean);
          if(trozos.length!==nPartes){alert('Elige el sabor de cada parte');return;}
        }
        var mods=[],nombres=[];
        grupos.forEach(function(g){
          elegidas(g).forEach(function(o){mods.push({grupoId:g.id,opcionId:o.id});nombres.push(o.nombre);});
        });
        if(trozos)nombres=trozos.map(function(t){
          var o=opcSab.find(function(x){return x.id===t;});return o?o.nombre:'';}).concat(nombres);
        carrito.push({productoId:p.id,nombre:p.nombre,cantidad:cant,modsElegidos:mods,partes:trozos,
          nombresMods:nombres,notas:($('#pn').value||'').trim(),importe:precio()});
        cerrar();barra();
      };
    }
    render();ov.classList.add('show');
  }

  function subtotal(){return carrito.reduce(function(t,i){return t+i.importe;},0);}
  // Mismo cálculo que hace el servidor: se ordenan las piezas que participan
  // de más cara a más barata y se regala la segunda de cada par.
  function calcular2x1(){
    if(!M.promo2x1||!M.promo2x1.categorias||!M.promo2x1.categorias.length)return null;
    var piezas=[];
    carrito.forEach(function(i){
      var p=M.productos.find(function(x){return x.id===i.productoId;});
      if(!p||M.promo2x1.categorias.indexOf(p.categoriaId)<0)return;
      var unit=i.importe/i.cantidad;
      for(var k=0;k<i.cantidad;k++)piezas.push({nombre:i.nombre,precio:unit});
    });
    if(piezas.length<2)return null;
    piezas.sort(function(a,b){return b.precio-a.precio;});
    var gratis=[];
    for(var j=1;j<piezas.length;j+=2)gratis.push(piezas[j]);
    var monto=gratis.reduce(function(t,x){return t+x.precio;},0);
    return {monto:Math.round(monto*100)/100,gratis:gratis};
  }
  function total(){var p=calcular2x1();return subtotal()-(p?p.monto:0);}
  function piezas(){return carrito.reduce(function(t,i){return t+i.cantidad;},0);}
  function barra(){
    var b=$('#bar');
    if(!carrito.length){b.style.display='none';return;}
    b.style.display='';
    var pr=calcular2x1();
    $('#barN').innerHTML=piezas()+(piezas()===1?' producto':' productos')+
      (pr?' <span class="ahorro">· ahorras '+money(pr.monto)+'</span>':'');
    $('#barT').textContent=money(total());
    $('#barB').onclick=verCarrito;
  }

  function verCarrito(){
    mo.className='mo';
    var pr=calcular2x1();
    mo.innerHTML='<div class="asa"></div><h3>Mi pedido</h3><div class="sub">'+piezas()+(piezas()===1?' producto':' productos')+'</div>'+
      carrito.map(function(i,k){
        var p=M.productos.find(function(x){return x.id===i.productoId;});
        return '<div class="it"><span class="th">'+img(p)+'</span><span class="tx"><span class="n">'+esc(i.nombre)+'</span>'+
          (i.nombresMods.length?'<div class="m">'+esc(i.nombresMods.join(' · '))+'</div>':'')+
          (i.notas?'<div class="m">“'+esc(i.notas)+'”</div>':'')+
          '<div class="p">'+money(i.importe)+'</div></span>'+
          '<span class="stp sm"><button data-menos="'+k+'">−</button><b>'+i.cantidad+'</b><button data-mas="'+k+'">+</button></span>'+
          '<button class="x" data-k="'+k+'" aria-label="Quitar">×</button></div>';}).join('')+
      (!pr&&M.promo2x1?'<div class="aviso">🍕 Con dos pizzas o más se aplica el <b>'+esc(M.promo2x1.nombre)+'</b> automáticamente.</div>':'')+
      '<div class="res"><div class="r"><span>Subtotal</span><span>'+money(subtotal())+'</span></div>'+
        (pr?'<div class="r promo"><span>🍕 '+esc(M.promo2x1.nombre)+'<div class="m">Gratis: '+esc(pr.gratis.map(function(g){return g.nombre;}).join(', '))+'</div></span><span>−'+money(pr.monto)+'</span></div>':'')+
        '<div class="tot"><span>Total</span><span>'+money(total())+'</span></div></div>'+
      '<div class="pago"><span class="ic">💵</span><span><b>Pagas al recibir</b><small>Efectivo al repartidor</small></span></div>'+
      '<button class="btn full" id="sig" style="margin-top:16px">Continuar con mis datos</button>'+
      '<button class="btn ghost full" id="mas" style="margin-top:9px">Agregar algo más</button>'+
      '<button class="btn ghost full" id="vaciar" style="margin-top:9px;color:var(--rojo2)">Vaciar mi pedido</button>';
    [].forEach.call(mo.querySelectorAll('[data-k]'),function(el){el.onclick=function(){
      carrito.splice(+el.dataset.k,1);barra();if(carrito.length)verCarrito();else cerrar();};});
    [].forEach.call(mo.querySelectorAll('[data-menos]'),function(el){el.onclick=function(){
      var i=carrito[+el.dataset.menos];
      if(i.cantidad>1){i.importe=i.importe/i.cantidad*(i.cantidad-1);i.cantidad--;}
      else carrito.splice(+el.dataset.menos,1);
      barra();if(carrito.length)verCarrito();else cerrar();};});
    [].forEach.call(mo.querySelectorAll('[data-mas]'),function(el){el.onclick=function(){
      var i=carrito[+el.dataset.mas];
      if(i.cantidad<20){i.importe=i.importe/i.cantidad*(i.cantidad+1);i.cantidad++;}
      barra();verCarrito();};});
    $('#vaciar').onclick=function(){carrito=[];barra();cerrar();};
    $('#mas').onclick=cerrar;
    $('#sig').onclick=pasoTelefono;
    ov.classList.add('show');
  }

  function pasoTelefono(){
    mo.className='mo';
    mo.innerHTML='<div class="asa"></div><h3>Tu teléfono</h3><div class="sub">Te mandamos un código por WhatsApp para confirmar que eres tú.</div>'+
      '<div class="f"><label>Celular a 10 dígitos</label><input id="tel" type="tel" inputmode="numeric" maxlength="14" value="'+esc(tel)+'" placeholder="5512345678"></div>'+
      '<div class="msg" id="m1"></div>'+
      '<button class="btn full" id="ok" style="margin-top:8px">Mandarme el código</button>';
    $('#ok').onclick=function(){
      var t=($('#tel').value||'').replace(/\D/g,'');
      if(t.length<10){$('#m1').className='msg mal';$('#m1').textContent='Escribe los 10 dígitos';return;}
      tel=t;$('#ok').disabled=true;$('#ok').textContent='Enviando…';
      fetch('/pedir/'+ROW+'/verificar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telefono:t,sucursalId:SUC})})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
        .then(function(x){
          if(!x.ok)throw new Error(x.j.error||'Error');
          if(x.j.autoconfirmar)pasoAutoconfirmar(x.j.autoconfirmar);
          else pasoCodigo(x.j.enviado);
        }).catch(function(e){$('#m1').className='msg mal';$('#m1').textContent=e.message;$('#ok').disabled=false;$('#ok').textContent='Mandarme el código';});
    };
    ov.classList.add('show');
  }

  function pasoCodigo(enviado){
    mo.innerHTML='<div class="asa"></div><h3>Escribe el código</h3><div class="sub">'+(enviado?'Te lo mandamos por WhatsApp al '+esc(tel):'Pídelo al negocio: '+esc(tel))+'</div>'+
      '<div class="f"><input id="cod" class="cod" inputmode="numeric" maxlength="4" placeholder="0000"></div>'+
      '<div class="msg" id="m2"></div>'+
      '<button class="btn full" id="ok2">Confirmar</button>'+
      '<button class="btn ghost full" id="otro" style="margin-top:8px">Cambiar el número</button>';
    $('#otro').onclick=pasoTelefono;
    var inp=$('#cod');
    inp.oninput=function(){inp.value=inp.value.replace(/\D/g,'').slice(0,4);if(inp.value.length===4)ir();};
    $('#ok2').onclick=ir;
    setTimeout(function(){inp.focus();},60);
    function ir(){
      var c=inp.value;
      if(c.length!==4){$('#m2').className='msg mal';$('#m2').textContent='Son 4 dígitos';return;}
      $('#ok2').disabled=true;
      fetch('/pedir/'+ROW+'/codigo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telefono:tel,codigo:c})})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
        .then(function(x){
          if(!x.ok)throw new Error(x.j.error||'Código incorrecto');
          token=x.j.token;pasoDireccion();
        }).catch(function(e){$('#m2').className='msg mal';$('#m2').textContent=e.message;inp.value='';$('#ok2').disabled=false;});
    }
  }

  // Sin servicio de mensajería: el cliente nos manda ÉL el código desde su
  // WhatsApp. Prueba igual que el número es suyo y no cuesta nada.
  function pasoAutoconfirmar(a){
    var mando=false;
    function render(){
      mo.innerHTML='<div class="asa"></div><h3>Confírmanos tu número</h3>'+
        '<div class="sub">Falta poco. Son dos pasos.</div>'+
        '<div class="paso'+(mando?' hecho':' activo')+'"><span class="pn">1</span>'+
          '<div style="flex:1"><b>Mándanos este código por WhatsApp</b>'+
          '<div class="pd">Así sabemos que el número es tuyo y podemos avisarte cuando salga tu pedido.</div>'+
          '<div class="cod2">'+esc(a.codigo)+'</div>'+
          (a.whatsappNegocio
            ? '<a class="btn '+(mando?'ghost':'')+' full" style="display:block;text-align:center;text-decoration:none;margin-top:10px" target="_blank" rel="noopener" id="wa" href="https://wa.me/'+esc(a.whatsappNegocio)+'?text='+encodeURIComponent('Confirmo mi pedido con el código '+a.codigo)+'">'+(mando?'Volver a mandarlo':'Abrir WhatsApp y mandarlo')+'</a>'
            : '<div class="msg mal">Falta configurar el WhatsApp del negocio.</div>')+
          '</div></div>'+
        '<div class="paso'+(mando?' activo':'')+'"><span class="pn">2</span>'+
          '<div style="flex:1"><b>Regresa aquí y continúa</b>'+
          '<div class="pd">Te vamos a pedir la dirección de entrega.</div>'+
          '<button class="btn full '+(mando?'':'ghost')+'" id="ya" style="margin-top:10px">'+(mando?'Ya lo mandé · Continuar':'Continuar sin mandarlo')+'</button>'+
          '</div></div>'+
        '<div class="msg" id="m2"></div>';
      if($('#wa'))$('#wa').onclick=function(){mando=true;setTimeout(render,400);};
      $('#ya').onclick=seguir;
    }
    function seguir(){
      $('#ya').disabled=true;$('#ya').textContent='Un momento…';
      fetch('/pedir/'+ROW+'/codigo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telefono:tel,codigo:a.codigo})})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
        .then(function(x){
          if(!x.ok)throw new Error(x.j.error||'Error');
          token=x.j.token;pasoDireccion();
        }).catch(function(e){$('#m2').className='msg mal';$('#m2').textContent=e.message;$('#ya').disabled=false;render();});
    }
    // Al regresar de WhatsApp, el paso 2 ya está esperando
    document.addEventListener('visibilitychange',function(){if(!document.hidden&&mando)render();});
    render();
  }

  function pasoDireccion(){
    mo.innerHTML='<div class="asa"></div><h3>¿A dónde lo llevamos?</h3>'+
      '<div class="f"><label>¿Quién recibe?</label><input id="dn" value="'+esc(datos.nombre||'')+'" placeholder="Tu nombre"></div>'+
      '<div class="f"><label>Calle</label><input id="dc" value="'+esc(datos.calle||'')+'"></div>'+
      '<div class="f"><label>Número</label><input id="dnum" value="'+esc(datos.numero||'')+'"></div>'+
      '<div class="f"><label>Colonia y pueblo</label><input id="dcol" value="'+esc(datos.colonia||'')+'" placeholder="Centro"></div>'+
      '<div class="f"><label>Referencias</label><input id="dr" value="'+esc(datos.referencias||'')+'" placeholder="Portón azul, frente a la tienda"></div>'+
      '<div class="f"><label>Notas para la cocina</label><textarea id="dnot" rows="2" maxlength="200" placeholder="Opcional"></textarea></div>'+
      (function(){var pr=calcular2x1();return pr?'<div class="aviso ok">Tu '+esc(M.promo2x1.nombre)+' ya está aplicado: ahorras <b>'+money(pr.monto)+'</b>.</div>':'';})()+
      '<div class="pago"><span class="ic">💵</span><span><b>Se paga al recibir</b><small>Te mandamos una liga para seguir tu pedido en vivo</small></span></div>'+
      '<div class="msg" id="m3"></div>'+
      '<button class="btn full" id="env" style="margin-top:12px">Enviar pedido · '+money(total())+'</button>';
    $('#env').onclick=function(){
      datos={nombre:$('#dn').value.trim(),calle:$('#dc').value.trim(),numero:$('#dnum').value.trim(),
        colonia:$('#dcol').value.trim(),referencias:$('#dr').value.trim()};
      var falta=[];
      if(!datos.nombre)falta.push('tu nombre');
      if(!datos.calle)falta.push('la calle');
      if(!datos.numero)falta.push('el número');
      if(!datos.colonia)falta.push('la colonia');
      if(falta.length){$('#m3').className='msg mal';$('#m3').textContent='Falta '+falta.join(', ');return;}
      $('#env').disabled=true;$('#env').textContent='Enviando…';
      fetch('/pedir/'+ROW+'/'+SUC+'/pedido',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:token,cliente:datos,notas:($('#dnot').value||'').trim(),
          items:carrito.map(function(i){return {productoId:i.productoId,cantidad:i.cantidad,modsElegidos:i.modsElegidos,partes:i.partes||null,notas:i.notas};})})})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
        .then(function(x){
          if(!x.ok)throw new Error(x.j.error||'No se pudo enviar');
          listo(x.j);
        }).catch(function(e){$('#m3').className='msg mal';$('#m3').textContent=e.message;$('#env').disabled=false;$('#env').textContent='Enviar pedido';});
    };
  }

  function listo(r){
    cerrar();
    $('#bar').style.display='none';
    $('#app').innerHTML='<div class="ok"><div class="big">'+(r.confirmado?'🍕':'📨')+'</div>'+
      '<h2>'+(r.confirmado?'¡Ya está en la cocina!':'Recibimos tu pedido')+'</h2>'+
      '<p><span class="folio">'+esc(r.folio)+'</span><br>'+money(r.total)+' al recibir<br>'+
      (r.confirmado?'La estamos preparando en este momento.':'En un momento te lo confirmamos por WhatsApp.')+'</p>'+
      '<a href="'+esc(r.seguimiento)+'">Ver dónde va mi pedido →</a></div>';
    window.scrollTo(0,0);
  }
})();
</script>
</body>
</html>
