// Cronómetro vivo: los minutos del tablero se refrescan cada 20s, pero el
// repartidor quiere ver correr el tiempo de la entrega que trae encima.
let cronoTimer=null;
function arrancarCronos(){
  if(cronoTimer){clearInterval(cronoTimer);cronoTimer=null;}
  const pinta=()=>{
    const els=document.querySelectorAll('[data-cron]');
    if(!els.length){if(cronoTimer){clearInterval(cronoTimer);cronoTimer=null;}return;}
    els.forEach(el=>{
      const t0=el.dataset.cron;if(!t0)return;
      const s=Math.max(0,Math.floor((Date.now()-new Date(t0).getTime())/1000));
      el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    });
  };
  pinta();cronoTimer=setInterval(pinta,1000);
}

function tarjetaPedidoRep(p,tipo,caja){
  const c=p.cliente||{};const r=p.reparto||{};
  const espera=tipo==='en_ruta'?minsDesde(r.salida):minsDesde(p.creado);
  // "Va tarde" se mide contra el propio promedio del negocio, no contra un número inventado
  const limite=tipo==='en_ruta'?Math.max(25,Math.round((p.promedioMin||22)*1.5)):20;
  const tarde=espera!=null&&espera>=limite;
  const duda=(caja&&p.destinoDudoso)?`<div class="rc-duda">
      <div><b>Ubicación en duda.</b> El punto guardado y la dirección escrita están a ${p.destinoDudoso.km.toFixed(1)} km uno del otro.</div>
      <div class="rc-duda-b">
        <button class="btn" data-usadir="${p.folio}">Usar la dirección escrita</button>
        <button class="btn" data-usaguardado="${p.folio}">El punto guardado es el bueno</button>
      </div></div>`:'';
  const avance=tipo==='en_ruta'?`<div class="rc-avance${tarde?' tarde':''}">
      ${p.distanciaKm!=null?`<span class="rc-km">${p.distanciaKm<1?Math.round(p.distanciaKm*1000)+' m':p.distanciaKm.toFixed(1)+' km'}</span><span class="rc-al">del domicilio${p.destinoFuente==='direccion'?' (por dirección)':''}</span>`
        :(p.moto?'<span class="rc-al">Sin domicilio ubicado — se aprende en esta entrega</span>':'<span class="rc-al">La moto no comparte ubicación</span>')}
      ${(p.distanciaKm!=null&&p.distanciaKm<0.15)?'<span class="rc-eta">está llegando</span>'
        :(p.etaMin!=null?`<span class="rc-eta">~${Math.max(1,p.etaMin)} min${p.etaBase==='historial'?'*':''}</span>`:'')}
      ${(p.reparto&&p.reparto.salida)?`<span class="rc-cron mono" data-cron="${p.reparto.salida}" title="tiempo transcurrido desde que salió">--:--</span>`:''}
    </div>`:'';
  const califica=r.calificacion?`<div class="rc-cal" title="${(r.calificacion.comentario||'').replace(/"/g,'')}">${estrellasTxt(r.calificacion.estrellas)}${r.calificacion.comentario?' <span class="rc-com">“'+r.calificacion.comentario.slice(0,60)+'”</span>':''}</div>`:'';
  return `<div class="rep-card ${tarde?'tarde':''}">
    <div class="rc-top"><span class="rc-folio">${p.codigo?`<b class="rc-cod">${p.codigo}</b> `:''}${p.folio}</span><span class="rc-tot">${money(p.total)}</span></div>
    <div class="rc-cli"><b>${c.nombre||'—'}</b>${c.telefono?` · <a class="ent-tel" href="tel:${c.telefono}">${c.telefono}</a>`:''}</div>
    <div class="rc-dir">${c.direccion||[c.calle,c.numero,c.colonia].filter(Boolean).join(' ')||'Sin dirección'}</div>
    ${c.referencias?`<div class="rc-ref">${c.referencias}</div>`:''}
    <div class="rc-meta">${p.items} art.${espera!=null?` · ${espera} min${tarde?' <b style="color:var(--red)">va tarde</b>':''}`:''}${r.repartidorNombre?` · ${r.repartidorNombre}`:''}${r.intentos?` · ${r.intentos} intento(s)`:''}${p.cocinaListo?' · <span class="rc-ok">cocina lista</span>':''}</div>
    ${duda}${avance}${califica}
    ${(tipo==='asignado'||tipo==='en_ruta')?`<div class="rc-nav">
      ${urlComoLlegar(p)?`<a class="btn nav" href="${urlComoLlegar(p)}" target="_blank" rel="noopener">🧭 Cómo llegar</a>`:''}
      ${c.telefono?`<a class="btn" href="tel:${c.telefono}">📞 Llamar al cliente</a>`:''}
    </div>`:''}
    <div class="rc-acts">
      ${tipo==='por_asignar'&&caja?`<button class="btn accent" data-asignar="${p.folio}">Asignar moto</button>`:''}
      ${tipo==='asignado'&&caja?`<button class="btn accent" data-salida="${p.folio}">Salió</button><button class="btn" data-asignar="${p.folio}">Cambiar</button>`:''}
      ${tipo==='asignado'&&!caja?`<button class="btn" data-soltar="${p.folio}">Soltar</button>`:''}
      ${tipo==='en_ruta'?`<button class="btn accent" data-entregar="${p.folio}">Entregar y cobrar</button>`:''}
      ${tipo==='en_ruta'&&caja?`<button class="btn" data-fallo="${p.folio}">No entregó</button>`:''}
      ${(tipo==='por_asignar'||tipo==='asignado')&&caja?`<button class="btn rojo" data-cancelar="${p.folio}">Cancelar</button>`:''}
      ${tipo==='en_ruta'&&caja?`<button class="btn" data-diag="${p.folio}" title="Por qué marca ese tiempo">¿Por qué?</button>
        <button class="btn" data-refijar="${p.folio}" title="Volver a ubicar con la dirección escrita">↻ Reubicar</button>`:''}
      ${tipo!=='entregado'&&caja?`<button class="btn" data-wa="${p.folio}" title="Abrir WhatsApp con la liga de seguimiento">Enviar liga</button>
        <button class="btn" data-copiaseg="${p.folio}" title="Copiar la liga para pegarla a mano">📋 Copiar</button>`:''}
      ${tipo==='entregado'?`<span class="rc-cash">${money(p.efectivo)} en efectivo</span><button class="btn" data-ticketrep="${p.folio}">Ticket</button>`:''}
    </div></div>`;
}

let mapaOp=null;
async function dibujarMapaOperacion(enRuta){
  const el=$('#repMapa');if(!el)return;
  const msg=(txt)=>{const m=$('#repMapaMsg');const mp=$('#repMapa');
    if(m){m.style.display=txt?'':'none';m.innerHTML=txt||'';}
    if(mp)mp.style.display=txt?'none':'';};
  // Si nadie comparte GPS no tiene caso pintar un mapa vacío
  const conGps=enRuta.filter(p=>p.moto).length;
  const conDest=enRuta.filter(p=>p.destino).length;
  if(!conGps&&!conDest){
    msg('Ninguna moto está compartiendo su ubicación.<br><span class="small">Pídele al repartidor que abra Reparto en su teléfono y toque <b>Prender</b> en el aviso de ubicación.</span>');
    return;
  }
  msg('');
  let L;
  try{L=await cargarLeaflet();}catch{msg('Sin conexión al mapa. Los minutos y la distancia siguen abajo.');return;}
  if(!$('#repMapa'))return; // la vista cambió mientras cargaba
  if(mapaOp){mapaOp.remove();mapaOp=null;}
  const pts=[];
  mapaOp=L.map(el,{zoomControl:false}).setView([19.4326,-99.1332],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(mapaOp);
  L.control.zoom({position:'bottomright'}).addTo(mapaOp);
  const ico=(txt,size)=>L.divIcon({className:'',html:`<div style="font-size:${size}px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))">${txt}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]});
  for(const p of enRuta){
    const r=p.reparto||{};
    if(p.rastro&&p.rastro.length>1){
      L.polyline(p.rastro.map(x=>[x.lat,x.lng]),{color:'#3b6ea5',weight:4,opacity:.55}).addTo(mapaOp);
      p.rastro.forEach(x=>pts.push([x.lat,x.lng]));
    }
    if(p.moto){
      L.marker([p.moto.lat,p.moto.lng],{icon:ico('🛵',26)}).addTo(mapaOp)
        .bindPopup(`<b>${r.repartidorNombre||'Repartidor'}</b><br>${p.folio}${p.distanciaKm!=null?`<br>a ${p.distanciaKm<1?Math.round(p.distanciaKm*1000)+' m':p.distanciaKm.toFixed(1)+' km'} del domicilio`:''}`);
      pts.push([p.moto.lat,p.moto.lng]);
    }
    if(p.destino){
      L.marker([p.destino.lat,p.destino.lng],{icon:ico('🏠',20)}).addTo(mapaOp)
        .bindPopup(`<b>${(p.cliente&&p.cliente.nombre)||''}</b><br>${(p.cliente&&p.cliente.direccion)||''}`);
      pts.push([p.destino.lat,p.destino.lng]);
    }
  }
  if(pts.length>1)mapaOp.fitBounds(L.latLngBounds(pts).pad(0.3));
  else if(pts.length===1)mapaOp.setView(pts[0],16);
  setTimeout(()=>{try{mapaOp.invalidateSize();}catch(e){}},120); // el contenedor acaba de aparecer
}

async function mandarSeguimiento(folio){
  let s;

  window.open(`https://wa.me/${num}?text=${encodeURIComponent(texto)}`,'_blank');

async function copiar(t){
  try{await navigator.clipboard.writeText(t);return true;}catch(e){}
  try{
    const i=document.createElement('textarea');
    i.value=t;i.style.position='fixed';i.style.opacity='0';
    document.body.appendChild(i);i.select();
    const ok=document.execCommand('copy');i.remove();
    return ok;
  }catch(e){return false;}
}

      const pr=propina(),tc=totalCon();let recibido=0;

async function pintarCocina(){
  const ordenes=await API.get('/api/cocina?sucursalId='+app.sucursalId);

  const now=Date.now();
  // estaciones presentes
  const estaciones=[...new Set(ordenes.flatMap(p=>p.items.map(l=>l.estacion||'Cocina')))].sort();
  if(!app.cocinaEst||(app.cocinaEst!=='__all'&&!estaciones.includes(app.cocinaEst)))app.cocinaEst='__all';
  const est=app.cocinaEst;
  const visibles=ordenes.map(p=>({...p,items:est==='__all'?p.items:p.items.filter(l=>(l.estacion||'Cocina')===est)})).filter(p=>p.items.length);
  // all-day por lo visible
  const allday={};visibles.forEach(p=>{if(!p.listo)p.items.forEach(l=>{allday[l.nombre]=(allday[l.nombre]||0)+l.cantidad;});});
  const adArr=Object.entries(allday).sort((a,b)=>b[1]-a[1]);
  const tier=min=>min>=12?'late':min>=6?'warn':'fresh';
  const tabs=estaciones.length>1?`<div class="cats" style="margin-bottom:12px"><button class="cat ${est==='__all'?'active':''}" data-est="__all">Todas</button>${estaciones.map(s=>`<button class="cat ${est===s?'active':''}" data-est="${s}">${s}</button>`).join('')}</div>`:'';
  $('#view').innerHTML=`${tabs}
  ${adArr.length?`<div class="allday"><span class="ad-lbl">Por preparar${est!=='__all'?' · '+est:''}:</span>${adArr.map(([n,q])=>`<span class="ad-chip"><b>${q}×</b> ${n}</span>`).join('')}</div>`:''}
  <div class="kds">${visibles.map(p=>{
    const min=Math.floor((now-new Date(p.recibido).getTime())/60000);
    const srv=p.tipoServicio==='mesa'?mesaNombre(p.mesaId):(p.tipoServicio==='domicilio'?'🛵 Domicilio':'🧾 Mostrador');
    const tk=p.listo?'ready':tier(min);
    return `<div class="ko ko-${tk} ${p.listo?'listo':''}"><div class="ko-head"><span class="folio">${p.folio}</span><span class="timer">${p.listo?'LISTO':min+' min'}</span></div><div class="ko-srv">${srv}${p.colonia?' · '+p.colonia:''}</div>

const M2=n=>Math.round((+n||0)*100)/100;

        ${ejemplo?`<div class="small" style="color:var(--muted);margin-top:4px">Precio final calculado sobre <b>${ejemplo.nombre}</b> (${money(ejemplo.precioBase)})</div>`:''}

function bindEditorGrupos(){
  // Recalcular el precio final mostrado mientras se teclea
  document.querySelectorAll('.ge-od').forEach(inp=>inp.oninput=()=>{
    const fin=inp.parentElement.querySelector('.ge-fin');
    const base=fin&&fin.dataset.base!=null?+fin.dataset.base:null;
    if(fin&&base!=null)fin.textContent=money(base+(+inp.value||0));
  });
  document.querySelectorAll('[data-quitar]').forEach(b=>b.onclick=()=>{
    const card=b.closest('.ge-card');
    if(card.querySelectorAll('.ge-ops .ge-op').length<=1){toast('El grupo necesita al menos una opción');return;}
    b.closest('.ge-op').remove();
  });
  document.querySelectorAll('[data-grpsave]').forEach(b=>b.onclick=async()=>{
    const card=b.closest('.ge-card');
    const opciones=[...card.querySelectorAll('.ge-ops .ge-op')].map(row=>({
      id:row.querySelector('.ge-onom').dataset.op,
      nombre:row.querySelector('.ge-onom').value.trim(),
      precioDelta:M2(row.querySelector('.ge-od').value),
    })).filter(o=>o.nombre);
    const nn=card.querySelector('.ge-nnom').value.trim();
    if(nn)opciones.push({nombre:nn,precioDelta:M2(card.querySelector('.ge-nd').value)});
    if(!opciones.length){toast('El grupo necesita al menos una opción');return;}
    try{
      await API.patch('/api/menu/grupos/'+b.dataset.grpsave,{nombre:card.querySelector('.ge-nom').value.trim(),opciones});
      toast('Modificadores actualizados',{tipo:'ok'});
      vMenu();
    }catch(e){toast(e.message);}
  });
}

const hoyISO=fechaHoy;

        <div class="field"><label>Categoría</label><select id="gCat"><option value="">Todas</option>
          ${cats.map(c=>`<option value="${c.id}" ${r.categoria===c.id?'selected':''}>${c.nombre}</option>`).join('')}</select></div>

    <div class="panel"><h3>Movimientos</h3>
      ${data.gastos.length?`<table><thead><tr><th>Fecha</th><th>Folio</th><th>Categoría</th><th>Proveedor</th><th>Concepto</th><th>Pago</th><th class="num">Total</th><th></th></tr></thead><tbody>
        ${data.gastos.map(g=>`<tr${g.estado==='cancelado'?' style="opacity:.45;text-decoration:line-through"':''}>

// Captura de gasto. Se usa desde Gastos y desde Caja (gasolina al vuelo).

function pintarSalon(mesas,sucNombre){

async function refrescarMesas(){
  if(app.vista!=='mesas'||ov.classList.contains('show'))return; // no refresques con un modal abierto (cobro)

async function cobrarMesa(mesaId){
  const m=(app._mesas||[]).find(x=>x.id===mesaId);

    cobrar();
  }catch(e){toast(e.message);}
}

async function abrirMesa(mesaId){
  if(!app.turno){toast('Abre el turno antes de atender mesas');return;}
  const m=(app._mesas||[]).find(x=>x.id===mesaId);
  try{
    if(m&&m.pedidoFolio){ // mesa con cuenta abierta: cargar la cuenta existente
      const p=await API.get('/api/pedidos/'+m.pedidoFolio);
      app.pos={folio:p.folio,pedido:p,tipoServicio:'mesa',mesaId,cat:app.pos.cat||cats()[0].id};
    }else{ // mesa libre: el pedido se crea hasta agregar el primer producto (no se ocupa en vacío)
      app.pos={folio:null,pedido:null,tipoServicio:'mesa',mesaId,cat:app.pos.cat||cats()[0].id};
    }
    go('pos');
  }catch(e){toast(e.message);}
}

async function vCaja(){
  const sucNombre=app.sucursales.find(s=>s.id===app.sucursalId)?.nombre||'';
  const hoy=fechaHoy();
  const [mesas,abiertos,resumen,recientes,reservas,cancelaciones]=await Promise.all([
    API.get('/api/mesas?sucursalId='+app.sucursalId),
    API.get('/api/pedidos?estado=abierto&sucursalId='+app.sucursalId),
    API.get('/api/reportes/resumen?sucursalId='+app.sucursalId),
    API.get('/api/ventas/recientes?sucursalId='+app.sucursalId+'&limit=10'),
    API.get('/api/reservas?sucursalId='+app.sucursalId),
    API.get('/api/cancelaciones?sucursalId='+app.sucursalId)
  ]);
  // El reparto no debe tumbar la caja si algo falla: se degrada a vacio.
  let motos=[],liquidaciones=[];

    API.get('/api/reparto/repartidores?sucursalId='+app.sucursalId),

  const cuentas=[...mesasAb,...otros];
  const totalCobrar=cuentas.reduce((s,c)=>s+(c.total||0),0);

    <div class="kpi"><div class="lab">Ventas (sucursal)</div><div class="val">${money(resumen.venta)}</div><div class="lab" style="margin-top:2px">${resumen.pedidos} ticket(s) · prom ${money(resumen.ticketPromedio)}</div></div>

async function cobrarDesdeCaja(folio){

const RES_EST={pendiente:{l:'Pendiente',c:'barra'},confirmada:{l:'Confirmada',c:'cocina'},sentada:{l:'Sentada',c:'ok'},cancelada:{l:'Cancelada',c:'low'},no_show:{l:'No llegó',c:'low'}};
function fmtFechaLarga(f){try{const[a,m,d]=f.split('-');return new Date(+a,+m-1,+d).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});}catch{return f;}}
async function vReservas(){
  const hoy=fechaHoy();

  const futuras=reservas.filter(r=>r.fecha>=hoy&&r.estado!=='cancelada'&&r.estado!=='no_show');
  const otras=reservas.filter(r=>!(r.fecha>=hoy&&r.estado!=='cancelada'&&r.estado!=='no_show'));
  const porFecha={};futuras.forEach(r=>{(porFecha[r.fecha]=porFecha[r.fecha]||[]).push(r);});

  const tarjeta=r=>`<div class="resv"><div class="resv-main"><div class="resv-top"><span class="resv-hora">${r.hora}</span><span class="resv-nom">${r.nombre}</span><span class="chip ${RES_EST[r.estado].c}">${RES_EST[r.estado].l}</span></div>
      <div class="resv-sub">${r.personas} pers.${r.mesaNombre?' · '+r.mesaNombre:''}${r.telefono?' · '+r.telefono:''}${r.notas?' · '+r.notas:''}</div></div>

  $('#view').innerHTML=`<div class="panel" style="margin-bottom:16px"><h3 style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">Reservas · ${sucNombre} <span class="small">${futuras.length} próxima(s)</span><button class="btn accent" id="newReserva" style="margin-left:auto;font-size:13px">+ Nueva reserva</button></h3>
    ${fechas.length?fechas.map(f=>`<div class="resv-fecha">${f===hoy?'Hoy · ':''}${fmtFechaLarga(f)}</div>${porFecha[f].map(tarjeta).join('')}`).join(''):'<div class="empty">No hay reservas próximas. Crea una con "Nueva reserva".</div>'}</div>
    ${otras.length?`<div class="panel"><h3>Historial <span class="small">canceladas, no llegó o pasadas</span></h3>${otras.slice(0,30).map(tarjeta).join('')}</div>`:''}`;
  $('#newReserva').onclick=()=>modalReserva(null);
  document.querySelectorAll('[data-rconf]').forEach(b=>b.onclick=()=>cambiarReserva(b.dataset.rconf,{estado:'confirmada'}));
  document.querySelectorAll('[data-rsent]').forEach(b=>b.onclick=()=>cambiarReserva(b.dataset.rsent,{estado:'sentada'}));
  document.querySelectorAll('[data-rcanc]').forEach(b=>b.onclick=()=>cambiarReserva(b.dataset.rcanc,{estado:'cancelada'}));
  document.querySelectorAll('[data-redit]').forEach(b=>b.onclick=()=>modalReserva(app._reservas.find(r=>r.id===b.dataset.redit)));
}

function descargarCSV(nombre,filas){
  const csv=filas.map(r=>r.map(c=>{const s=String(c==null?'':c);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=nombre;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function exportarReportesCSV(res){
  const fecha=new Date().toLocaleDateString('es-MX');const suc=app.sucursales.find(s=>s.id===app.sucursalId)?.nombre||'';

    ['Venta total',res.venta],['Pedidos',res.pedidos],['Ticket promedio',res.ticketPromedio],['Propinas',res.propinas||0],[],
    ['VENTAS POR PRODUCTO'],['Producto','Piezas','Importe']];
  Object.entries(res.porProducto||{}).sort((a,b)=>b[1].total-a[1].total).forEach(([n,d])=>f.push([n,d.q,d.total]));
  f.push([],['POR SERVICIO'],['Servicio','Importe']);['mostrador','domicilio','mesa'].forEach(k=>f.push([k,res.porServicio[k]]));
  f.push([],['POR MÉTODO DE PAGO'],['Método','Importe']);['efectivo','tarjeta','transferencia'].forEach(k=>f.push([k,res.porPago[k]]));
  f.push([],['POR HORA'],['Hora','Venta','Pedidos']);(res.porHora||[]).forEach((x,h)=>{if(x.venta>0)f.push([String(h).padStart(2,'0')+':00',x.venta,x.pedidos]);});
  // Reparto y gastos del mismo periodo, para que el CSV cuente la historia completa
  try{
    const d=await API.get('/api/reparto/reporte'+qsRango(app.sucursalId,app._repRango));
    if(d.entregas){
      f.push([],['REPARTO A DOMICILIO'],['Entregas',d.entregas],['Piezas',d.piezas],['Venta',d.venta],['Minutos promedio en ruta',d.minutosPromedioEnRuta==null?'':d.minutosPromedioEnRuta]);
      f.push([],['RANKING DE REPARTIDORES'],['Repartidor','Entregas','Piezas','Venta','Ticket promedio','Min. promedio','Calificación','Fallidos']);
      d.repartidores.slice().sort((a,b)=>b.venta-a.venta).forEach(x=>f.push([x.nombre,x.entregas,x.piezas,x.venta,x.ticketPromedio,x.minutosPromedio==null?'':x.minutosPromedio,x.calificacion==null?'':x.calificacion,x.fallidos]));
      if((d.porDia||[]).length){f.push([],['ENTREGAS POR DÍA'],['Día','Entregas','Piezas','Venta']);d.porDia.forEach(x=>f.push([x.dia,x.entregas,x.piezas,x.venta]));}
    }
  }catch(e){}
  try{
    const g=await API.get('/api/gastos'+qsRango(app.sucursalId,app._repRango));
    if(g.resumen.movimientos){
      f.push([],['GASTOS'],['Gasto operativo',g.resumen.operativos],['Compra de insumos',g.resumen.compras],['Salida total',g.resumen.total]);
      f.push([],['GASTOS POR CATEGORÍA'],['Categoría','Importe','Movimientos','Es inventario']);
      g.resumen.porCategoria.forEach(x=>f.push([x.nombre,x.total,x.movimientos,x.inventario?'sí':'no']));
      f.push([],['DETALLE DE GASTOS'],['Fecha','Folio','Categoría','Proveedor','Concepto','Pago','Total']);
      g.gastos.filter(x=>x.estado!=='cancelado').forEach(x=>f.push([
        new Date(x.fecha).toLocaleDateString('es-MX'),x.folio,x.categoria,x.proveedor||'',
        x.lineas.map(l=>`${l.cantidad}x ${l.descripcion}`).join(' | '),x.metodoPago,x.total]));
    }
  }catch(e){}
  descargarCSV(`reporte_ventas_${fecha.replace(/\//g,'-')}.csv`,f);
  toast('CSV descargado');
}

    out.innerHTML=`<div style="font-size:13px;color:var(--muted)">Prime cost (insumos + nómina)</div><div style="font-family:'Bricolage Grotesque';font-weight:700;font-size:28px;color:${c}">${pct}%</div><div style="font-size:13px;color:var(--muted)">${pct<=65?'Saludable ✓':pct<=72?'En el límite, vigílalo':'Alto — revisa nómina y food cost'}</div>`;};

}

      ${s.coordenadas?`<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${s.coordenadas.lat},${s.coordenadas.lng}">Ver en el mapa</a>`:''}
    </div></div>`).join('');
  const datos=(id)=>{const k=c.querySelector(`[data-suc="${id}"]`);
    return {direccion:k.querySelector('.suc-dir').value.trim(),coordenadas:k.querySelector('.suc-coord').value.trim()};};
  c.querySelectorAll('[data-sucsave]').forEach(b=>b.onclick=async()=>{
    const d=datos(b.dataset.sucsave);
    try{await API.patch('/api/sucursales/'+b.dataset.sucsave,{direccion:d.direccion,coordenadas:d.coordenadas||null});
      toast('Sucursal actualizada',{tipo:'ok'});pintarSucursales();}
    catch(e){toast(e.message);}
  });
  c.querySelectorAll('[data-sucgeo]').forEach(b=>b.onclick=async()=>{
    const d=datos(b.dataset.sucgeo);
    if(!d.direccion){toast('Captura primero la dirección');return;}
    b.disabled=true;const t=b.textContent;b.textContent='Buscando…';
    try{const r=await API.post(`/api/sucursales/${b.dataset.sucgeo}/ubicar`,{direccion:d.direccion});
      toast(`Ubicada: ${r.etiqueta||'listo'}`,{tipo:'ok',ms:6000});pintarSucursales();}
    catch(e){toast(e.message,{ms:6000});b.disabled=false;b.textContent=t;}
  });
}
// El respaldo se baja al equipo del dueño: si la base se pierde o se corrompe,
// es lo único que queda fuera del servidor.
async function descargarRespaldo(){
  const b=$('#btnRespaldo');const txt=b.textContent;
  b.disabled=true;b.textContent='Preparando…';
  try{
    const r=await fetch('/api/admin/respaldo',{headers:{Authorization:'Bearer '+API.token}});
    if(!r.ok)throw new Error('No se pudo generar el respaldo');
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`respaldo_${((app.tenant&&app.tenant.nombre)||'restaurante').replace(/[^a-zA-Z0-9]+/g,'_')}_${fechaHoy()}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast(`Respaldo descargado (${Math.round(blob.size/1024)} KB) · guárdalo fuera del servidor`,{tipo:'ok',ms:6000});
  }catch(e){toast(e.message);}
  b.disabled=false;b.textContent=txt;
}

  // El usuario da acceso; la ficha de Personal es la que recibe pedidos y

  const PUESTOS={repartidor:'Repartidor',mesero:'Mesero',cocinero:'Cocinero',cajero:'Cajero',gerente:'Gerente',admin:'Administrador'};
  const syncFicha=()=>{
    const rol=$('#usR').value;

      await API.post('/api/usuarios',{username:u,password:p,rol,sucursalId:$('#usS').value||null});

    if(quiereFicha){
      try{
        await API.post('/api/rh/empleados',{nombre,puesto:PUESTOS[rol],username:u,sucursalId:$('#usS').value||null});
        closeModal();toast(`Usuario y ficha de ${PUESTOS[rol]} creados`,{tipo:'ok',ms:4000});
      }catch(e){
        closeModal();toast('Usuario creado, pero la ficha falló: '+e.message,{ms:5000});
      }
    }else{closeModal();toast('Usuario creado');}
    vAjustes();
  };
}

  const w=window.open('','qr','width=420,height=560');if(!w){toast('Permite ventanas emergentes');return;}
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>QR ${nombre}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
    <style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px;color:#211a12}h1{font-size:22px;margin:4px 0}.s{color:#8a7f70;margin-bottom:18px}#qr{display:inline-block;padding:14px;background:#fff;border:1px solid #ece3d5;border-radius:16px}.u{font-size:11px;color:#8a7f70;word-break:break-all;margin-top:14px}button{margin-top:18px;padding:11px 20px;border:none;border-radius:10px;background:#211a12;color:#fff;font-weight:700;font-size:15px;cursor:pointer}@media print{button{display:none}}</style>
    </head><body><div class="s">Escanea para ver el menú y pedir</div><h1>${nombre}</h1><div id="qr"></div><div class="u">${url}</div><button onclick="window.print()">Imprimir</button>
    <script>window.onload=function(){new QRCode(document.getElementById('qr'),{text:${JSON.stringify(url)},width:280,height:280,correctLevel:QRCode.CorrectLevel.M});};<\/script>
    </body></html>`);
  w.document.close();
}
function imprimirCorte(r){
  const E=r.esperado;const suc=app.sucursales.find(s=>s.id===app.sucursalId)?.nombre||'';
  const liqs=(app._liqs||[]).filter(l=>l.turnoId===r.id);
  const av=r.avisosReparto||null;
  const w=window.open('','corte','width=340,height=680');if(!w){toast('Permite ventanas emergentes');return;}
  const f=new Date(r.cerrado).toLocaleString('es-MX');
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Corte</title><style>body{font-family:'Courier New',monospace;width:280px;margin:0 auto;padding:10px;font-size:12px;color:#000}.r{display:flex;justify-content:space-between;margin:3px 0}.b{font-weight:bold}hr{border:none;border-top:1px dashed #000;margin:6px 0}h2{text-align:center;font-size:15px;margin:2px 0}</style></head><body>
  <h2>CORTE DE CAJA</h2><div style="text-align:center">${(app.tenant&&app.tenant.nombre)||''} · ${suc}</div><div style="text-align:center">${f}</div><div style="text-align:center">Cerró: ${r.cerradoPor||''}</div><hr>
  <div class="r"><span>Fondo inicial</span><span>${money(E.fondoInicial)}</span></div>
  ${E.entradas?`<div class="r"><span>Entradas</span><span>${money(E.entradas)}</span></div>`:''}
  ${E.salidas?`<div class="r"><span>Retiros</span><span>-${money(E.salidas)}</span></div>`:''}
  ${E.propinasEfectivo?`<div class="r"><span>Propinas efectivo</span><span>${money(E.propinasEfectivo)}</span></div>`:''}
  <div class="r b"><span>Efectivo esperado</span><span>${money(E.efectivo)}</span></div>
  <div class="r"><span>Efectivo contado</span><span>${money(r.conteo)}</span></div>
  <div class="r b"><span>${r.resultado.toUpperCase()}</span><span>${money(Math.abs(r.diferencia))}</span></div><hr>
  <div class="r"><span>Tarjeta</span><span>${money(E.tarjeta)}</span></div>
  <div class="r"><span>Transferencia</span><span>${money(E.transferencia)}</span></div>
  <div class="r b"><span>Venta total</span><span>${money(E.ventaTotal)}</span></div>
  ${E.propinasTotal?`<div class="r"><span>Propinas a repartir</span><span>${money(E.propinasTotal)}</span></div>`:''}
  ${liqs.length?`<hr><div class="b" style="text-align:center">REPARTO</div>
    ${liqs.map(l=>`<div class="r"><span>${l.repartidorNombre} (${l.pedidos})</span><span>${money(l.conteoEfectivo)}</span></div>${l.diferencia?`<div class="r"><span>&nbsp;&nbsp;${l.diferencia<0?'faltante':'sobrante'}</span><span>${money(Math.abs(l.diferencia))}</span></div>`:''}`).join('')}
    <div class="r b"><span>Liquidado en efectivo</span><span>${money(liqs.reduce((t,l)=>t+l.conteoEfectivo,0))}</span></div>`:''}
  ${av&&av.sinLiquidar?`<hr><div class="r b"><span>CERRADO CON ${av.sinLiquidar} ENTREGA(S) SIN LIQUIDAR</span><span></span></div>`:''}
  ${av&&av.enRuta?`<div class="r"><span>Pedidos aún en ruta</span><span>${av.enRuta}</span></div>`:''}
  </body></html>`);
  w.document.close();setTimeout(()=>{try{w.focus();w.print();}catch(e){}},350);
}
function modalCerrarTurno(){
  const t=app.turno;
  modal.innerHTML=`<h3>Cerrar turno</h3><div class="sub">Cuenta el efectivo del cajón</div>
    <div class="field"><label>Efectivo contado</label><input id="conteo" type="number" class="mono" placeholder="0.00"></div><div id="difBox"></div>
    <div class="modal-foot"><button class="btn-ghost" id="cCancel">Cancelar</button><button class="btn-primary" id="cOk">Cerrar turno</button></div>`;
  ov.classList.add('show');$('#cCancel').onclick=closeModal;
  $('#cOk').onclick=async()=>{if($('#conteo').value===''){toast('Captura el efectivo');return;}
    try{const r=await API.post('/api/caja/cerrar',{turnoId:t.id,conteoEfectivo:+$('#conteo').value});const res=r.resultado;const E=r.esperado;
      modal.innerHTML=`<h3>Corte de turno</h3><div class="breakdown">
        <div class="b"><span>Fondo inicial</span><span>${money(E.fondoInicial)}</span></div>
        <div class="b"><span>Ventas efectivo</span><span>${money(r.esperado.efectivo - E.fondoInicial - E.entradas + E.salidas - E.propinasEfectivo)}</span></div>
        ${E.propinasEfectivo?`<div class="b"><span>Propinas efectivo (en cajón)</span><span>${money(E.propinasEfectivo)}</span></div>`:''}
        ${E.entradas?`<div class="b"><span>Entradas</span><span>${money(E.entradas)}</span></div>`:''}
        ${E.salidas?`<div class="b"><span>Retiros</span><span>-${money(E.salidas)}</span></div>`:''}
        <div class="b hl"><span>Efectivo esperado</span><span>${money(E.efectivo)}</span></div>
        <div class="b"><span>Efectivo contado</span><span>${money(r.conteo)}</span></div>
        <div class="b"><span>Ventas tarjeta</span><span>${money(E.tarjeta)}</span></div>
        <div class="b"><span>Ventas transferencia</span><span>${money(E.transferencia)}</span></div>
        <div class="b hl"><span>Venta total del turno</span><span>${money(E.ventaTotal)}</span></div>
        ${E.propinasTotal?`<div class="b"><span>Propinas a repartir</span><span>${money(E.propinasTotal)}</span></div>`:''}
      </div><div class="result ${res}">${res==='cuadrado'?'Caja cuadrada':res==='faltante'?'FALTANTE':'SOBRANTE'} ${money(Math.abs(r.diferencia))}</div>
      <div class="modal-foot"><button class="btn-ghost" id="cImpr">🖨 Imprimir corte</button><button class="btn-primary" id="cDone">Entendido</button></div>`;
      app.turno=null;renderTopbar();
      if($('#cImpr'))$('#cImpr').onclick=()=>imprimirCorte(r);
      $('#cDone').onclick=()=>{closeModal();go(app.vista);};
    }catch(e){toast(e.message);}};
}

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});}
boot();
</script>
