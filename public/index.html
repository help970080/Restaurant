<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jefe Pizzas — Consola</title>
<meta name="theme-color" content="#e0841a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jefe Pizzas">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17150f;--ink2:#221f17;--paper:#f4f1ea;--card:#fff;--line:#e5dfd2;
    --accent:#e0841a;--accent-ink:#7a4708;--accent-bg:#fbeed8;
    --green:#2f8f4e;--green-bg:#e7f3ea;--red:#c8472f;--red-bg:#fbe9e4;
    --blue:#3b6ea5;--blue-bg:#e7eef6;--muted:#8c857a;--mono:'Spline Sans Mono',monospace;
  }
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:15px;height:100vh;overflow:hidden}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  #app{height:100%}

  /* LOGIN */
  .login{height:100%;display:flex;align-items:center;justify-content:center;background:var(--ink)}
  .login-card{background:var(--card);border-radius:20px;padding:34px 30px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .login-card .logo{font-family:'Bricolage Grotesque';font-weight:700;font-size:30px;text-align:center;margin-bottom:4px}
  .login-card .logo b{color:var(--accent)}
  .login-card .tg{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
  .login-card label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
  .login-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:15px}
  .login-card button{width:100%;padding:13px;background:var(--accent);color:#2c1c04;font-weight:700;font-size:16px;margin-top:20px}
  .login-card .err{color:var(--red);font-size:13px;text-align:center;margin-top:12px;min-height:18px}

  /* SHELL */
  .shell{display:flex;height:100%}
  .sidebar{width:218px;background:var(--ink);color:#e8e3d8;display:flex;flex-direction:column;flex:0 0 auto}
  .logo{font-family:'Bricolage Grotesque';font-weight:700;font-size:21px;letter-spacing:-.02em;padding:18px 20px 14px}
  .logo b{color:var(--accent)}
  .brandlogo{max-height:40px;max-width:172px;display:block;object-fit:contain}
  .brandtext{font-family:'Bricolage Grotesque';font-weight:700;font-size:20px;line-height:1.1;display:block}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cols2-wide{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  @media(max-width:900px){.cols2-wide{grid-template-columns:1fr}}
  .checagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(180px,100%),1fr));gap:12px}
  .checacard{text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:3px;transition:transform .08s}
  .checacard:active{transform:scale(.97)}
  .checacard.on{border-color:var(--green);background:#eef7f0}
  .checacard .cknom{font-family:'Bricolage Grotesque';font-weight:700;font-size:17px}
  .checacard .ckpue{font-size:12px;color:var(--muted)}
  .checacard .ckstat{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:5px}
  .checacard.on .ckstat{color:var(--green);font-weight:600}
  .checacard .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
  .checacard .ckact{margin-top:8px;font-size:13px;font-weight:600;color:var(--accent-ink)}
  .checacard.on .ckact{color:var(--green)}
  .nav{flex:1;padding:6px 10px;overflow-y:auto}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;color:#b7b0a2;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:500;margin-bottom:2px}
  .nav button:hover{background:#272318;color:#e8e3d8}
  .nav button.active{background:var(--accent);color:#2c1c04;font-weight:600}
  .nav svg{width:18px;height:18px;flex:0 0 auto}
  .nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-family:var(--mono);padding:1px 7px;border-radius:999px;font-weight:600}
  .nav button.active .badge{background:#2c1c04;color:var(--accent)}
  .side-foot{padding:12px 16px;border-top:1px solid #2a261b;font-size:12px;color:#8c857a;display:flex;justify-content:space-between;align-items:center}
  .side-foot button{background:none;color:#b7b0a2;font-size:12px;padding:4px 8px}
  .side-foot button:hover{color:#e8e3d8}

  .app-main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:13px;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line);flex:0 0 auto}
  .vtitle{font-family:'Bricolage Grotesque';font-weight:700;font-size:22px}
  .spacer{flex:1}
  select.suc{padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-weight:600;font-size:14px;background:var(--card)}
  .turno-pill{font-size:13px;padding:7px 13px;border-radius:999px;font-weight:600;font-family:var(--mono)}
  .turno-pill.off{background:var(--paper);color:var(--muted)}
  .turno-pill.on{background:var(--green-bg);color:var(--green)}
  .btn{padding:9px 15px;font-weight:600;font-size:14px;background:var(--paper);color:var(--ink);border:1px solid var(--line)}
  .btn:hover{background:#ece7dc}
  .btn.accent{background:var(--accent);color:#2c1c04;border-color:var(--accent)}
  .btn.dark{background:var(--ink);color:#e8e3d8;border-color:var(--ink)}
  .view{flex:1;overflow-y:auto;padding:22px;min-height:0}
  .loading{color:var(--muted);text-align:center;padding:60px}

  /* CARDS / GRID */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:14px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .kpi .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .kpi .val{font-family:var(--mono);font-size:28px;font-weight:600;margin-top:6px;overflow-wrap:anywhere;line-height:1.15}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .kpi.accent{background:var(--accent-bg);border-color:#eccfa0}.kpi.accent .val{color:var(--accent-ink)}
  .cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
  @media(max-width:1000px){.cols{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .panel h3{font-family:'Bricolage Grotesque';font-size:17px;margin:0 0 14px}
  .panel h3 .small{font-family:'Inter';font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 8px;font-size:14px;border-bottom:1px solid var(--line)}
  th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  td.num,th.num{text-align:right;font-family:var(--mono)}tr:last-child td{border-bottom:none}
  .thumb{display:inline-block;width:50px;height:38px;border-radius:8px;overflow:hidden;vertical-align:middle;margin-right:10px;border:1px solid var(--line)}
  .thumb .art{width:50px;height:38px;display:block}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .chip.cocina{background:var(--accent-bg);color:var(--accent-ink)}.chip.barra{background:var(--blue-bg);color:var(--blue)}
  .chip.ok{background:var(--green-bg);color:var(--green)}.chip.low{background:var(--red-bg);color:var(--red)}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .bar-row .bn{font-size:13px;width:140px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-row .bt{flex:1;height:22px;background:var(--paper);border-radius:6px;overflow:hidden}
  .bar-row .bf{height:100%;background:var(--accent);border-radius:6px}
  .bar-row .bv{font-family:var(--mono);font-size:13px;width:70px;text-align:right;flex:0 0 auto}

  /* POS */
  .pos{display:grid;grid-template-columns:1fr 360px;gap:16px;height:100%}
  @media(max-width:900px){.pos{grid-template-columns:1fr}}
  .pos-menu{overflow-y:auto}
  .cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .cat{background:var(--card);border:1px solid var(--line);padding:10px 17px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted)}
  .cat.active{background:var(--ink);color:#e8e3d8;border-color:var(--ink)}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(176px,100%),1fr));gap:16px}
  .prod{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .08s,box-shadow .12s;padding:0}
  .prod:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.09)}
  .prod:active{transform:scale(.98)}
  .prod .art{height:134px;width:100%;display:block;object-fit:cover}
  .prod .meta{padding:12px 14px}
  .prod .nm{font-weight:600;font-size:16px;line-height:1.25}
  .prod .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .prod .pr{font-family:var(--mono);font-weight:600;color:var(--accent-ink)}
  .prod .dest{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .ticket{background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
  .thead{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .thead .mfolio{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .thead a{color:var(--accent-ink);font-size:12px;cursor:pointer;font-weight:600}
  .svc{display:flex;gap:6px;padding:12px 14px 0}
  .svc button{flex:1;padding:9px;font-weight:600;font-size:13px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
  .svc button.active{background:var(--ink);color:#e8e3d8;border-color:var(--ink)}
  .canalsel{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}
  .canalchip{padding:8px 12px;font-size:12px;font-weight:600;border-radius:999px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
  .canalchip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .cli{padding:10px 14px 0}.cli input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;margin-bottom:6px;font-size:13px}
  .lines{flex:1 1 auto;padding:12px 14px;min-height:40px}
  .empty{color:var(--muted);text-align:center;padding:30px 8px;font-size:14px;line-height:1.5}
  .line{border-bottom:1px dashed var(--line);padding:10px 0;display:flex;gap:8px}
  .line .lname{font-weight:600;font-size:14px}.line .lmod{font-size:12px;color:var(--muted);margin-top:2px}
  .line .lnote{font-size:12px;color:var(--accent-ink);font-style:italic;margin-top:2px}
  .line .lprice{font-family:var(--mono);font-weight:600;font-size:14px;white-space:nowrap}
  .line .rm{background:none;color:var(--muted);font-size:16px;padding:0 4px;align-self:flex-start}.line .rm:hover{color:var(--red)}
  .totals{padding:12px 14px;border-top:2px solid var(--ink);position:sticky;bottom:0;background:var(--card);z-index:2}
  .trow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--muted)}
  .trow.tot{font-size:19px;font-weight:700;color:var(--ink);padding-top:8px}
  .extra-btns{display:flex;gap:6px;margin:8px 0}
  .extra-btns button{flex:1;background:var(--paper);border:1px solid var(--line);padding:7px;font-size:12px;font-weight:600;color:var(--muted)}
  .pay{width:100%;padding:13px;background:var(--green);color:#fff;font-weight:700;font-size:16px;margin-top:4px}
  .pay.amber{background:var(--accent);color:#2c1c04}
  .pay:disabled{background:#cfc9bd;color:#fff;cursor:not-allowed}
  .paymesa{display:flex;gap:8px;margin-top:4px}.paymesa .pay{margin-top:0}

  /* KDS */
  .kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:14px}
  .ko{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;border-left-width:6px}
  .ko.listo{border-color:var(--green)}
  .ko-fresh{border-left-color:var(--green)}.ko-warn{border-left-color:var(--accent)}.ko-late{border-left-color:var(--red)}
  .ko-late .ko-head .timer{color:var(--red);font-weight:700}.ko-warn .ko-head .timer{color:var(--accent-ink)}
  .ko-ready{border-left-color:var(--green);opacity:.85}
  .allday{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:14px}
  .allday .ad-lbl{font-weight:700;font-size:13px;opacity:.8}
  .allday .ad-chip{background:rgba(255,255,255,.14);padding:5px 11px;border-radius:999px;font-size:13px}
  .allday .ad-chip b{color:var(--accent)}
  .ko-est{font-size:10px;background:var(--soft);color:var(--accent-ink);padding:1px 6px;border-radius:999px;font-weight:700;vertical-align:middle;margin-left:4px}
  .offbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 16px;font-size:13px;font-weight:600}
  .offbar.off{background:#fde7e3;color:#a3331f;border-bottom:1px solid #f3c5bb}
  .offbar.on{background:#e7f5ec;color:#1f7a47;border-bottom:1px solid #c5e6d2}
  .offbar button{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .offbar .offcount{margin-left:auto}
  .hbars{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:8px}
  .hbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .hbar-fill{width:100%;max-width:26px;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px;transition:height .2s}
  .hbar-lbl{font-size:10px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
  .ko-head{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;font-weight:600;border-bottom:1px solid var(--line)}
  .ko-head .folio{font-family:var(--mono)}.ko-head .timer{font-family:var(--mono);font-size:13px}.ko-head .timer.warn{color:var(--red)}
  .ko-srv{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 14px;margin-top:6px}
  .ko-body{padding:8px 14px;flex:1}
  .ko-item{font-size:14px;padding:4px 0}.ko-item .m{font-size:12px;color:var(--muted)}.ko-item .n{font-size:12px;color:var(--accent-ink);font-style:italic}
  .ko-foot{padding:10px 14px;border-top:1px solid var(--line)}.ko-foot button{width:100%;padding:9px;font-weight:600;font-size:13px}
  .b-listo{background:var(--accent);color:#2c1c04}.b-entregar{background:var(--green);color:#fff}

  /* MESAS */
  .mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(168px,100%),1fr));gap:16px}
  .mesa{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:center;transition:transform .08s,box-shadow .12s;display:flex;flex-direction:column}
  .mesa:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.09)}
  .mesa:active{transform:scale(.98)}
  .mesa .art{width:100%;height:130px;display:block}
  /* touch: blancos de toque cómodos */
  .btn,.pay,.cat,.modal-foot button,.modal-foot a,.paytabs button,.svc button,.cuenta-btn{min-height:46px;display:inline-flex;align-items:center;justify-content:center}
  .mesa .mbody{padding:10px 12px 12px}
  .mesa .ms{font-size:12px;font-weight:600;margin-top:2px}
  .mesa.libre .ms{color:var(--green)}.mesa.ocupada .ms{color:var(--red)}.mesa.cuenta .ms{color:var(--accent-ink);font-weight:600}
  .mesa .mtot{font-family:var(--mono);font-weight:600;font-size:15px;margin-top:3px}
  .mesa .cuenta-btn{margin-top:8px;width:100%;background:var(--blue-bg);color:var(--blue);font-weight:600;font-size:12px;padding:6px;border:1px solid var(--blue-bg)}
  .mesa .pay-btn{margin-top:6px;width:100%;background:var(--green);color:#fff;font-weight:700;font-size:13px;padding:8px;border:none;border-radius:9px;cursor:pointer}
  .mesa .lib-btn{margin-top:4px;width:100%;background:none;color:var(--muted);font-size:12px;padding:4px;border:none;cursor:pointer;text-decoration:underline}

  /* MODAL */
  .ov{position:fixed;inset:0;background:rgba(20,18,12,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .ov.show{display:flex}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;padding:20px}
  .modal h3{font-family:'Bricolage Grotesque';margin:0 0 2px;font-size:20px}.modal .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .grp{margin-bottom:14px}.grp .glabel{font-weight:600;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between}
  .grp .req{font-size:11px;color:var(--red);font-weight:600;text-transform:uppercase}
  .opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer}
  .opt:hover{border-color:var(--accent)}.opt input{accent-color:var(--accent);width:17px;height:17px}
  .opt .onm{flex:1;font-size:14px}.opt .od{font-family:var(--mono);font-size:13px;color:var(--accent-ink)}
  .field{margin-bottom:12px}.field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
  .field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:15px}
  .field input.mono{font-family:var(--mono);font-size:18px}
  .nota{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px}
  .modal-foot{display:flex;gap:8px;margin-top:14px}.modal-foot button{flex:1;padding:12px;font-weight:700;font-size:15px}
  .btn-ghost{background:var(--paper);color:var(--ink)}.btn-primary{background:var(--ink);color:#e8e3d8}.btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .paytabs{display:flex;gap:6px;margin-bottom:12px}.paytabs button{flex:1;padding:9px;font-size:13px;font-weight:600;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
  .paytabs button.active{background:var(--ink);color:#e8e3d8;border-color:var(--ink)}
  .bignum{font-family:var(--mono);font-size:30px;font-weight:700;text-align:center;padding:6px 0}
  .cambio{text-align:center;font-weight:600;font-family:var(--mono);font-size:16px;min-height:22px}
  .breakdown{background:var(--paper);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-family:var(--mono);font-size:14px}
  .breakdown .b{display:flex;justify-content:space-between;padding:3px 0}.breakdown .b.hl{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px;font-weight:600}
  .result{text-align:center;padding:14px;border-radius:10px;font-weight:700;font-size:18px;margin-top:6px}
  .result.faltante{background:var(--red-bg);color:var(--red)}.result.sobrante{background:#fdf3df;color:var(--accent-ink)}.result.cuadrado{background:var(--green-bg);color:var(--green)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#e8e3d8;padding:12px 20px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{background:var(--green);color:#fff;font-size:15px;padding:14px 24px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .resv-fecha{font-family:'Bricolage Grotesque';font-weight:700;font-size:15px;margin:14px 0 8px;text-transform:capitalize}
  .resv{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line)}
  .resv-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .resv-hora{font-family:'Bricolage Grotesque';font-weight:700;font-size:16px;min-width:48px}
  .resv-nom{font-weight:600}
  .resv-sub{color:var(--muted);font-size:13px;margin-top:2px}
  .resv-acc{display:flex;gap:6px;flex-wrap:wrap}
  .chip.ok{background:#e7f5ec;color:var(--green)}
  .cuentas-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff7ec;border:1px solid var(--accent);border-radius:12px;padding:8px 12px;margin-bottom:12px}
  .cuentas-strip .cs-lbl{font-weight:700;font-size:13px;color:var(--accent-ink)}
  .cuentas-strip .cs-chip{background:var(--ink);color:#fff;border:none;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
  .cuentas-strip .cs-chip:hover{opacity:.88}
  .tip-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .tip-row .tip-btn{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;cursor:pointer}
  .tip-row .tip-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
  .tip-row input{max-width:92px}
  .prod.agotado{opacity:.5;filter:grayscale(.7);cursor:not-allowed;position:relative}
  .prod .ago-badge{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;z-index:2}
  .lnk-split{display:block;width:100%;background:none;border:1px dashed var(--line);border-radius:10px;color:var(--accent-ink);font-weight:600;font-size:13px;padding:7px;margin:8px 0 4px;cursor:pointer}
  .lnk-split:hover{background:var(--soft)}
  .prod .pdesc{font-size:11px;color:var(--muted);margin:2px 0 4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  .navtog{display:none}
  .navbk{display:none}
  @media(max-width:820px){
    .navtog{display:inline-flex;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--line);border-radius:9px;width:40px;height:40px;font-size:20px;flex:0 0 auto;cursor:pointer}
    .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:60;width:80%;max-width:280px;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.4)}
    .shell.navopen .sidebar{transform:none}
    .navbk{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
    .shell.navopen .navbk{opacity:1;pointer-events:auto}
    .app-main{width:100%}
    .topbar{padding:10px 14px;gap:9px;flex-wrap:wrap}
    .vtitle{font-size:18px}
    select.suc{padding:7px 9px;font-size:13px;max-width:130px}
    .turno-pill{font-size:12px;padding:6px 9px}
    .topbar .btn{padding:8px 12px;font-size:13px}
    .view{padding:14px}
    .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
    .pos{grid-template-columns:1fr;height:auto;gap:14px}
    .ticket{height:auto;max-height:none;overflow:visible}
    .pgrid{grid-template-columns:repeat(2,1fr);gap:10px}
    .cols2,.cols2-wide,.grid2{grid-template-columns:1fr!important}
    .view table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
    .panel{padding:14px}
  }
  

/* ---- Reparto propio ---- */
.ent-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;position:relative}
.ent-card.vacia{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}
.ent-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.ent-tel{color:var(--blue);text-decoration:none;font-family:var(--mono);font-size:12px}
.ent-dir{font-size:13px;color:var(--ink);margin-top:2px}
.ent-ref{font-size:12px;color:var(--muted);margin-top:2px;font-style:italic}
.ent-edit{margin-top:8px;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.ent-card.vacia .ent-edit{margin-top:0;border-color:var(--accent);color:var(--accent)}
.rep-motos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:10px}
.rep-moto{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.rm-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rm-sub{font-size:12px;color:var(--muted);margin-top:2px}
.rm-cash{font-family:var(--mono);font-size:18px;font-weight:700;margin-top:6px;color:var(--muted)}
.rm-cash.hay{color:var(--accent)}
.rep-moto .btn{margin-top:8px;width:100%}
.rep-board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.rep-col{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:90px}
.rep-col-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px}
.rep-n{background:var(--paper);border-radius:20px;padding:1px 8px;font-size:12px}
.rep-card{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;padding:9px 10px;margin-bottom:8px;background:#fff}
.rep-card.tarde{border-left-color:var(--red);background:#fff8f6}
.rc-top{display:flex;justify-content:space-between;align-items:baseline}
.rc-folio{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rc-tot{font-family:var(--mono);font-weight:700}
.rc-cli{font-size:13px;margin-top:3px}
.rc-dir{font-size:12px;color:var(--ink);margin-top:2px;line-height:1.35}
.rc-ref{font-size:11px;color:var(--muted);font-style:italic;margin-top:2px}
.rc-meta{font-size:11px;color:var(--muted);margin-top:5px}
.rc-ok{color:var(--green);font-weight:700}
.rc-cash{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent)}
.rc-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.rc-acts .btn{padding:6px 10px;font-size:12px}

/* ---- Editor de precios y modificadores en Menú ---- */
.pr-ed{width:92px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;text-align:right;font-weight:700;background:#fff}
.pr-ed:focus{border-color:var(--accent);outline:none}
.ge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.ge-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.ge-head{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:8px}
.ge-nom{flex:1;font-weight:700;border:none;border-bottom:1px dashed var(--line);padding:3px 0;background:none;font-size:14px}
.ge-nom:focus{outline:none;border-bottom-color:var(--accent)}
.ge-op{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.ge-onom{flex:1;min-width:0;padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px}
.ge-od{width:76px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;text-align:right;font-size:13px}
.ge-fin{width:72px;text-align:right;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--green)}
.ge-x{border:none;background:none;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;padding:0 2px;width:18px}
.ge-x:hover{color:var(--red)}
.ge-op.nueva{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}

/* ---- Banner de GPS del repartidor ---- */
.gps-card{display:flex;align-items:center;gap:12px;justify-content:space-between;background:#fff;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:12px;padding:11px 14px;margin-bottom:14px}
.gps-card.on{border-left-color:var(--green);background:#f4fbf6}
.gps-t{font-weight:700;font-size:14px}
.gps-s{font-size:12px;color:var(--muted);margin-top:2px}
.gps-card .btn{white-space:nowrap;font-size:13px;padding:8px 14px}

/* ---- Avance de entrega y calificaciones ---- */
.rc-avance{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:6px;padding:5px 8px;background:#f4f8fb;border-radius:8px;font-size:12px}
.rc-avance.tarde{background:#fdf1ee}
.rc-km{font-family:var(--mono);font-weight:700;color:var(--blue);font-size:13px}
.rc-avance.tarde .rc-km{color:var(--red)}
.rc-al{color:var(--muted)}
.rc-eta{margin-left:auto;font-weight:700;color:var(--green)}
.rc-cal{margin-top:6px;font-size:13px;color:var(--accent);letter-spacing:1px}
.rc-com{color:var(--muted);font-size:11px;font-style:italic;letter-spacing:0}
.leaflet-container{border-radius:12px}

.rep-board.moto{grid-template-columns:repeat(3,1fr)}
.rm-warn{margin-top:6px;font-size:11px;color:var(--red);background:#fdf1ee;border-radius:7px;padding:5px 7px;line-height:1.35}

.gps-card.err{border-left-color:var(--red);background:#fdf1ee}
.rc-nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rc-nav .btn{flex:1;min-width:130px;text-align:center;text-decoration:none;padding:9px 10px;font-size:13px;font-weight:700}
.rc-nav .btn.nav{background:var(--blue);color:#fff;border-color:var(--blue)}

.lnk-gps{background:none;border:none;color:var(--blue);text-decoration:underline;font-size:12px;font-weight:700;cursor:pointer;padding:0;margin-left:4px}
#modal ol{margin:10px 0 0;padding-left:20px;font-size:13.5px;line-height:1.55}
#modal ol li{margin-bottom:10px}

/* ---- Invitación a instalar la app ---- */
.inst-bar{display:flex;align-items:center;gap:12px;background:#fffaf2;border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin:12px 18px 0}
.inst-ico{font-size:24px;line-height:1;flex:none}
.inst-t{font-weight:700;font-size:14px}
.inst-s{font-size:12px;color:var(--muted);margin-top:1px}
.inst-bar .btn{margin-left:auto;white-space:nowrap;font-size:13px;padding:8px 16px}
.inst-x{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:0 2px;flex:none}
.inst-x:hover{color:var(--ink)}

/* =====================================================================
   TABLET Y CELULAR — una sola capa, alineada al corte de 820px del panel.
   Antes cada bloque nuevo traía su propio corte (640/900/1100) y en caja
   los números grandes desbordaban su tarjeta.
   ===================================================================== */
@media(max-width:1100px){
  .sidebar{width:190px}
  .logo{padding:16px 14px 12px;font-size:19px}
  .view{padding:16px}
  .rep-board{grid-template-columns:repeat(2,1fr)}
  #repMapa{height:260px}
}
@media(max-width:820px){
  /* Números de caja: caben en media pantalla sin romper la tarjeta */
  .kpi .val{font-size:21px;margin-top:4px}
  .kpi .lab{font-size:11px;letter-spacing:.03em}
  .kpi{padding:12px}
  .kpis{gap:8px;margin-bottom:14px}

  /* Tableros y paneles a una columna */
  .rep-board,.rep-board.moto,.ge-grid{grid-template-columns:1fr}
  .rep-motos{grid-template-columns:repeat(auto-fill,minmax(min(180px,100%),1fr));gap:8px}
  #repMapa{height:230px}
  #map{height:220px}

  /* Barras de aviso: el botón baja en vez de exprimir el texto */
  .gps-card,.inst-bar{flex-wrap:wrap}
  .gps-card .btn,.inst-bar .btn{width:100%;margin-left:0}
  .inst-bar{margin:10px 14px 0}

  /* Acciones de tarjeta a ancho completo, cómodas para el pulgar */
  .rc-acts .btn{flex:1 1 auto;min-width:0}
  .rc-nav{gap:8px}
  .rc-nav .btn{min-width:0;flex:1 1 46%}

  /* Tablas también dentro de los modales */
  #modal table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  .modal{padding:16px;max-height:92vh}
  .ov{padding:10px}

  /* Editor de precios y modificadores */
  .ge-op{flex-wrap:nowrap}
  .ge-od{width:64px}
  .ge-fin{width:62px;font-size:11px}
  .pr-ed{width:80px}
}
@media(max-width:480px){
  .view{padding:12px}
  .panel{padding:12px}
  .kpis{grid-template-columns:1fr}
  .kpi .val{font-size:24px}
  .pgrid{grid-template-columns:repeat(2,1fr)}
  .rep-motos{grid-template-columns:1fr}
  .topbar{padding:9px 12px;gap:7px}
  .vtitle{font-size:16px}
  select.suc{max-width:104px;font-size:12px}
  .turno-pill{font-size:11px;padding:5px 8px}
  .inst-bar{margin:10px 12px 0}
  .rc-nav .btn{flex:1 1 100%}
  .modal h3{font-size:18px}
  .bignum{font-size:26px}
  .paytabs{flex-wrap:wrap}
  .paytabs button{flex:1 1 30%}
}
@media(max-width:360px){
  .pgrid{grid-template-columns:1fr}
  .kpi .val{font-size:22px}
}

/* ---- Gastos ---- */
.gs-top{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.gs-top .field{margin:0;flex:1 1 150px;min-width:0}
.gs-top .btn{flex:0 0 auto}
.gs-cat{display:flex;align-items:center;gap:10px;padding:6px 0}
.gs-cn{flex:0 0 200px;font-size:13px;font-weight:600}
.gs-inv{font-size:10px;background:var(--blue-bg,#eaf1f8);color:var(--blue);border-radius:5px;padding:1px 5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.gs-bar{flex:1;height:9px;background:var(--paper);border-radius:5px;overflow:hidden;min-width:40px}
.gs-bar div{height:100%;border-radius:5px}
.gs-cm{flex:0 0 92px;text-align:right;font-weight:700;font-size:13px}
.gs-cp{flex:0 0 40px;text-align:right;font-size:12px;color:var(--muted)}
.gx-l{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.gx-l .gx-desc,.gx-l .gx-ins{flex:1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.gx-cant,.gx-pu{width:74px;padding:8px;border:1px solid var(--line);border-radius:8px;text-align:right;font-size:13px}
.gx-imp{width:82px;text-align:right;font-size:12px;font-weight:700;color:var(--green)}
.gx-x{border:none;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 2px}
.gx-x:hover{color:var(--red)}
@media(max-width:820px){
  .gs-cn{flex:0 0 120px;font-size:12px}
  .gs-cm{flex:0 0 76px;font-size:12px}
  .gx-cant,.gx-pu{width:62px}
  .gx-imp{width:64px;font-size:11px}
}

/* ---- Campana, badges y tira de reparto en caja ---- */
.campana{background:none;border:1px solid var(--line);border-radius:9px;width:38px;height:38px;font-size:17px;cursor:pointer;flex:0 0 auto;line-height:1}
.campana.off{opacity:.45}
.badge.urg{background:var(--red);color:#fff;animation:lat 1.4s infinite}
@keyframes lat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.tira{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.tira.alerta{border-left-color:var(--red);background:#fff8f6}
.tira.vacia{color:var(--muted);font-size:13px;border-left-color:var(--line);justify-content:center}
.tira-i{min-width:74px}
.tira-n{font-family:var(--mono);font-size:19px;font-weight:700;line-height:1.1}
.tira-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-top:1px}
.tira-i.ojo .tira-n{color:var(--accent-ink)}
.tira-i.mal .tira-n{color:var(--red)}
.tira .btn{margin-left:auto;font-size:12px;padding:7px 12px}
.tira-msg{font-size:12px;color:var(--red);margin:-8px 0 14px;padding-left:14px}
@media(max-width:820px){
  .tira{gap:6px;padding:9px 11px}
  .tira-i{min-width:60px}
  .tira-n{font-size:16px}
  .tira-l{font-size:10px}
  .tira .btn{width:100%;margin-left:0;margin-top:4px}
}

/* ---- Ranking de repartidores y entregas por día ---- */
.rk-bar{height:5px;background:var(--paper);border-radius:3px;margin-top:4px;overflow:hidden}
.rk-bar div{height:100%;background:var(--accent);border-radius:3px}
.dia-r{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.dia-f{flex:0 0 96px;color:var(--muted);text-transform:capitalize}
.dia-b{flex:1;height:8px;background:var(--paper);border-radius:4px;overflow:hidden;min-width:30px}
.dia-b div{height:100%;background:var(--blue);border-radius:4px}
.dia-n{flex:0 0 26px;text-align:right;font-weight:700}
.dia-v{flex:0 0 84px;text-align:right}
@media(max-width:820px){.dia-f{flex:0 0 76px}.dia-v{flex:0 0 70px}}

/* ---- Pantalla del repartidor ---- */
.moto-hero{background:var(--ink);color:#f2ede2;border-radius:16px;padding:14px 16px;margin-bottom:12px;text-align:center}
.moto-hero.apura{background:var(--red)}
.mh-l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.75;font-weight:700}
.mh-cron{font-family:var(--mono);font-size:40px;font-weight:700;line-height:1.05;margin:2px 0}
.mh-sub{font-size:12.5px;opacity:.85}
.moto-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.mt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 8px;text-align:center;min-width:0}
.mt b{display:block;font-family:var(--mono);font-size:16px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.mt span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600;margin-top:2px}
.mt.ojo b{color:var(--accent-ink)}
.moto-corte{margin-bottom:12px}
.mc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{background:var(--paper);border-radius:10px;padding:8px;text-align:center}
.mc b{display:block;font-family:var(--mono);font-size:15px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.mc span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600;margin-top:2px}
.mc-liq{margin-top:10px;background:#fffaf2;border:1px solid var(--accent);border-radius:10px;padding:8px 10px;font-size:13px;text-align:center}
.mc-ok{margin-top:10px;color:var(--green);font-size:13px;text-align:center;font-weight:600}
.rc-cron{margin-left:auto;font-size:12px;font-weight:700;color:var(--blue)}
@media(max-width:360px){.moto-tiles{grid-template-columns:repeat(2,1fr)}.mc-grid{grid-template-columns:repeat(2,1fr)}}

/* ---- Zona de riesgo: limpieza de pruebas ---- */
.panel.riesgo{border-color:var(--red)}
.panel.riesgo h3{color:var(--red)}
.lm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr));gap:6px;margin-bottom:12px}
.lm-r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;font-size:13px;background:var(--paper)}
.lm-r b{font-family:var(--mono)}
.lm-r.va{background:#fdf1ee;color:var(--red)}
.lm-r.queda{background:#f2faf4;color:var(--green)}

<script>
// ===========================================================================
//  Cliente de API
// ===========================================================================
const API = {
  get token(){return localStorage.getItem('cp_token');},
  set token(v){v?localStorage.setItem('cp_token',v):localStorage.removeItem('cp_token');},
  async call(method,path,body){
    const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(this.token?{Authorization:'Bearer '+this.token}:{})},body:body?JSON.stringify(body):undefined});
    if(r.status===401&&this.token){this.token=null;boot();throw new Error('Sesión expirada');}
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.error||('Error '+r.status));
    return data;
  },
  get(p){return this.call('GET',p);},post(p,b){return this.call('POST',p,b);},patch(p,b){return this.call('PATCH',p,b);},del(p){return this.call('DELETE',p);},
};
const money=n=>'$'+(+(n||0)).toFixed(2);
function ivaTasa(){const f=(app.tenant&&app.tenant.fiscal)||app._fiscal||{};return f.ivaTasa!=null?+f.ivaTasa:16;}
function rangoPeriodo(preset){
  const now=new Date();const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};const eod=d=>{const x=new Date(d);x.setHours(23,59,59,999);return x;};
  let desde=null,hasta=null,label='Todo';
  if(preset==='hoy'){desde=sod(now);hasta=eod(now);label='Hoy';}
  else if(preset==='ayer'){const y=new Date(now);y.setDate(y.getDate()-1);desde=sod(y);hasta=eod(y);label='Ayer';}
  else if(preset==='semana'){const wd=(now.getDay()+6)%7;const mon=new Date(now);mon.setDate(now.getDate()-wd);desde=sod(mon);hasta=eod(now);label='Esta semana';}
  else if(preset==='mes'){desde=sod(new Date(now.getFullYear(),now.getMonth(),1));hasta=eod(now);label='Este mes';}
  else if(preset==='mespasado'){desde=sod(new Date(now.getFullYear(),now.getMonth()-1,1));hasta=eod(new Date(now.getFullYear(),now.getMonth(),0));label='Mes pasado';}
  return {desde,hasta,label};
}
function periodoAnterior(desde,hasta){
  if(!desde||!hasta)return {desde:null,hasta:null};
  const dur=hasta.getTime()-desde.getTime();const prevHasta=new Date(desde.getTime()-1);const prevDesde=new Date(prevHasta.getTime()-dur);
  return {desde:prevDesde,hasta:prevHasta};
}
function qsRango(suc,r){let q=suc?('sucursalId='+suc):'';if(r&&r.desde)q+=(q?'&':'')+'desde='+encodeURIComponent(r.desde.toISOString())+'&hasta='+encodeURIComponent(r.hasta.toISOString());return q?('?'+q):'';}
function crecimiento(actual,previo){if(previo==null||previo===0)return null;return Math.round((actual-previo)/previo*1000)/10;}
function badgeCrec(pct){if(pct==null)return '';const up=pct>=0;return `<span style="font-size:12px;font-weight:700;color:${up?'var(--green)':'var(--red)'}">${up?'▲':'▼'} ${Math.abs(pct)}%</span>`;}
const $=s=>document.querySelector(s);
const ov=$('#ov'),modal=$('#modal');
function closeModal(){ov.classList.remove('show');modal.innerHTML='';}
ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
let tt;function toast(m,opts){opts=opts||{};const t=$('#toast');t.textContent=m;t.classList.toggle('ok',opts.tipo==='ok');t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),opts.ms||2400);}

function prodArt(prod,catName){
  if(prod.foto)return `<img class="art" src="${prod.foto}" alt="${prod.nombre}" onerror="this.outerHTML=prodArtFallback('${(catName||'').replace(/'/g,'')}','${prod.nombre.replace(/'/g,'')}')">`;
  return prodArtFallback(catName,prod.nombre);
}
// ¿El negocio es pizzería? Se deduce del nombre del restaurante o de sus
// categorías, para no ponerle pizzas a la nevería ni a la hamburguesería.
function esPizzeria(){
  if(app.tenant&&/pizz/i.test(app.tenant.nombre||''))return true;
  return Object.values((app.menu&&app.menu.categorias)||{}).some(c=>/pizz/i.test(c.nombre||''));
}
function prodArtFallback(catName,nombre){
  const n=(nombre||'').toLowerCase(),c=(catName||'').toLowerCase();
  const pizzeria=esPizzeria();
  // El nombre del producto manda sobre la categoría
  if(/agua|limonada|jamaica|horchata/.test(n))return artAgua();
  if(/refresco|soda|coca|bebida/.test(n))return artSoda();
  // Pizza antes que hamburguesa: en una pizzería "BBQ Pollo" es una pizza.
  if(/pizza|peperoni|pepperoni|mega jefe|barra/.test(n)||/pizza/.test(c))return artPizza();
  if(/spaghetti|espagueti|pasta|lasa[gn̈ñ]/.test(n)||c.includes('pasta'))return artPasta();
  if(/papa|fries|aro|nugget/.test(n))return artFries();
  if(!pizzeria&&(/hamburg|burger|bbq|doble|combo|sandwich|pollo/.test(n)||c.includes('hamburg')))return artBurger();
  if(c.includes('acompa'))return artFries();
  if(c.includes('bebida'))return artSoda();
  // En una pizzería, lo que quede sin clasificar casi siempre es una pizza.
  return pizzeria?artPizza():artPlato();
}

// --- GPS del repartidor -----------------------------------------------------
// Se reporta cada 25s mientras traiga pedidos en ruta. Solo la última posición:
// el servidor no guarda recorrido. El repartidor lo prende y lo apaga.
let geoTimer=null;
const gpsOn=()=>localStorage.getItem('cp_gps')==='1';
// Un fallo de ubicación tiene tres causas muy distintas y el mensaje tiene que
// decir cuál es: el permiso del sitio, el permiso de la app en Android, o el
// GPS del teléfono apagado. "Permiso denegado" a secas no ayuda a nadie.
function leerPosicion(opciones){
  return new Promise((ok,err)=>navigator.geolocation.getCurrentPosition(ok,err,opciones));
}
async function posicionConReintento(){
  try{
    return await leerPosicion({enableHighAccuracy:true,timeout:15000,maximumAge:10000});
  }catch(e){
    // Timeout o sin fix fino: se reintenta sin alta precisión, que casi siempre
    // sí responde (torres y wifi). Un permiso denegado no se reintenta.
    if(e&&e.code===1)throw e;
    return await leerPosicion({enableHighAccuracy:false,timeout:20000,maximumAge:60000});
  }
}
function textoErrorGPS(err){
  if(!err)return 'No se pudo leer la ubicación';
  if(err.code===1)return 'Ubicación bloqueada para este sitio';
  if(err.code===2)return 'El teléfono no encuentra señal de GPS';
  if(err.code===3)return 'La ubicación tardó demasiado en responder';
  return err.message||'No se pudo leer la ubicación';
}
async function permisoGPS(){
  try{
    if(!navigator.permissions||!navigator.permissions.query)return 'desconocido';
    const p=await navigator.permissions.query({name:'geolocation'});
    return p.state; // granted | denied | prompt
  }catch{return 'desconocido';}
}
function iniciarGPS(silencioso){
  if(!navigator.geolocation){if(!silencioso)toast('Este navegador no maneja ubicación');return;}
  if(!window.isSecureContext){app._gpsErr='La página no va por HTTPS';app._gpsCodigo=0;pintarBannerGPS();return;}
  localStorage.setItem('cp_gps','1');
  if(geoTimer)clearInterval(geoTimer);
  const mandar=async()=>{
    let pos;
    try{pos=await posicionConReintento();}
    catch(err){
      app._gpsErr=textoErrorGPS(err);app._gpsCodigo=err&&err.code;
      if(app.vista==='reparto')pintarBannerGPS();
      return;
    }
    app._gpsErr=null;app._gpsCodigo=null;
    try{
      const r=await API.post('/api/reparto/ubicacion',{lat:pos.coords.latitude,lng:pos.coords.longitude,precision:pos.coords.accuracy});
      app._gpsUlt=new Date().toISOString();app._gpsRuta=r.enRuta;app._gpsPrec=Math.round(pos.coords.accuracy||0);
    }catch(e){
      // 403/404: este usuario no tiene ficha de repartidor. No tiene caso seguir
      // intentando ni enseñarle el error a caja.
      if(/no es de repartidor|ficha de empleado/i.test(e.message||'')){detenerGPS();return;}
      app._gpsErr=e.message;app._gpsCodigo=null;
    }
    if(app.vista==='reparto')pintarBannerGPS();
  };
  mandar();geoTimer=setInterval(mandar,25000);
  if(!silencioso)toast('Buscando tu ubicación…');
}
function detenerGPS(){
  localStorage.removeItem('cp_gps');
  if(geoTimer){clearInterval(geoTimer);geoTimer=null;}
  app._gpsUlt=null;app._gpsErr=null;
  if(app.vista==='reparto')pintarBannerGPS();
}
function pintarBannerGPS(){
  const c=$('#gpsBanner');if(!c)return;
  const on=gpsOn();
  // Tres estados distintos, no dos: apagado, prendido con problema y funcionando.
  const fallando=on&&!!app._gpsErr;
  const clase=fallando?'err':(on&&app._gpsUlt?'on':'');
  let titulo,detalle;
  if(!on){titulo='Ubicación apagada';detalle='Préndela para que el cliente vea dónde va su pedido';}
  else if(fallando){
    titulo='No se está compartiendo';
    detalle=`<b style="color:var(--red)">${app._gpsErr}</b> <button class="lnk-gps" id="gpsAyuda">¿Cómo lo arreglo?</button>`;
  }
  else if(app._gpsUlt){
    titulo='Compartiendo tu ubicación';
    detalle=`Última señal ${new Date(app._gpsUlt).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}${app._gpsPrec?` · precisión ${app._gpsPrec} m`:''}${app._gpsRuta?` · ${app._gpsRuta} pedido(s) en ruta`:''}`;
  }
  else{titulo='Buscando señal…';detalle='Dale unos segundos. No cierres esta pantalla.';}
  c.innerHTML=`<div class="gps-card ${clase}">
    <div><div class="gps-t">${titulo}</div><div class="gps-s">${detalle}</div></div>
    <button class="btn ${on?'':'accent'}" id="gpsTog">${on?'Apagar':'Prender'}</button></div>`;
  $('#gpsTog').onclick=()=>{if(on){detenerGPS();}else{app._gpsErr=null;app._gpsCodigo=null;iniciarGPS();}pintarBannerGPS();};
  if($('#gpsAyuda'))$('#gpsAyuda').onclick=modalArreglarGPS;
}

  }
  const dx={granted:['El navegador SÍ dio el permiso','var(--green)'],

      ${perm==='denied'?'<div class="small" style="margin-top:4px">Cuando está bloqueado, el navegador ya no vuelve a preguntar: hay que cambiarlo a mano.</div>':''}
      ${app._gpsCodigo===2?'<div class="small" style="margin-top:4px">El permiso puede estar bien: lo que falla es la señal. Sal a la calle o enciende el GPS.</div>':''}
    </div>
    ${pasos}
    <div class="modal-foot"><button class="btn-ghost" id="gaCerrar">Cerrar</button><button class="btn-primary" id="gaProbar">Probar ahora</button></div>`;
  ov.classList.add('show');

const Sonido={
  ctx:null,
  encendido(){return localStorage.getItem('cp_sonido')!=='0';},
  prender(v){localStorage.setItem('cp_sonido',v?'1':'0');if(v)this.despertar();},
  despertar(){
    try{
      if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();}
      if(this.ctx.state==='suspended')this.ctx.resume();
    }catch(e){}
  },
  nota(f,inicio,dur,vol){
    if(!this.ctx)return;
    const t=this.ctx.currentTime+inicio;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(this.ctx.destination);
    o.start(t);o.stop(t+dur+0.02);
  },
  PATRONES:{
    cocina:   [[880,0,.14,.22],[1318,.15,.20,.22]],           // llegó comanda
    listo:    [[1046,0,.10,.20],[1046,.14,.10,.20],[1568,.28,.18,.20]],

    liquidar: [[523,0,.12,.18],[659,.13,.12,.18],[523,.26,.18,.18]],
  },
  tocar(nombre){
    if(!this.encendido())return;
    this.despertar();

const setDe=a=>new Set(a||[]);
const nuevosEn=(antes,ahora)=>(ahora||[]).filter(x=>!antes.has(x));
async function latido(){

  if(!prev){app._tardiosAvisados=setDe(a.reparto.tardios);return;} // primer sondeo: sin ruido
  const ev=[];
  const nCocina=nuevosEn(setDe(prev.cocina.pendientes),a.cocina.pendientes);
  if(nCocina.length)ev.push(['cocina',`${nCocina.length===1?'Nueva comanda':nCocina.length+' comandas nuevas'} · ${nCocina.join(', ')}`,120]);
  const nListos=nuevosEn(setDe(prev.cocina.listos),a.cocina.listos);
  if(nListos.length)ev.push(['listo',`Listo para servir · ${nListos.join(', ')}`,80]);
  const nDom=nuevosEn(setDe(prev.reparto.porAsignar),a.reparto.porAsignar);
  if(nDom.length)ev.push(['domicilio',`Domicilio por asignar · ${nDom.join(', ')}`,120]);
  const nEnt=nuevosEn(setDe(prev.reparto.entregados),a.reparto.entregados);
  if(nEnt.length)ev.push(['entregado',`Entregado · ${nEnt.join(', ')}`,0]);
  const nLiq=nuevosEn(setDe(prev.reparto.porLiquidar),a.reparto.porLiquidar);
  if(nLiq.length&&puedeCobrar())ev.push(['liquidar',`Efectivo por liquidar: ${money(a.reparto.efectivoPendiente)}`,0]);
  const nCob=nuevosEn(setDe(prev.caja.porCobrar),a.caja.porCobrar);
  if(nCob.length&&puedeCobrar())ev.push(['cobrar',`Cuenta por cobrar · ${nCob.join(', ')}`,0]);
  // Un pedido tardío avisa una sola vez, no cada 15 segundos
  if(!app._tardiosAvisados)app._tardiosAvisados=new Set();
  const nTarde=nuevosEn(app._tardiosAvisados,a.reparto.tardios);
  if(nTarde.length){ev.push(['tarde',`Entrega demorada · ${nTarde.join(', ')}`,300]);}
  app._tardiosAvisados=setDe(a.reparto.tardios);
  ev.slice(0,3).forEach(([son,txt,vib],i)=>setTimeout(()=>{
    Sonido.tocar(son);if(vib)Sonido.vibrar(vib);
    toast(txt,{ms:son==='tarde'?7000:5000,tipo:son==='tarde'?undefined:'ok'});
  },i*900));
}

// Fecha LOCAL del equipo. toISOString() da UTC y a las 8 de la noche en México
// ya marca el día siguiente: los reportes del turno de noche salían vacíos.
function fechaHoy(){
  // Debe ser el día DEL RESTAURANTE, no el del aparato: si la tablet trae otra
  // zona horaria (o el turno pasa de medianoche en UTC), el rango que manda el
  // panel no coincidiría con el que calculan los reportes del servidor.
  const tz=(app.tenant&&app.tenant.zonaHoraria)||null;
  if(tz){try{return new Date().toLocaleDateString('en-CA',{timeZone:tz});}catch(e){}}
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function esAdmin(){return app.rol==='admin'||app.rol==='gerente';}
// Un domicilio ya asignado sale de las listas de caja: se cobra en la vista Reparto.
function enReparto(p){return p&&p.tipoServicio==='domicilio'&&p.reparto&&p.reparto.estado!=='por_asignar';}
function minsDesde(iso){if(!iso)return null;return Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));}
// Quien cobro fisicamente el pedido: en domicilio es el motorista, no la caja.
function quienCobro(p){
  if(p.reparto&&p.reparto.repartidorNombre)return '🛵 '+p.reparto.repartidorNombre+(p.reparto.liquidado?'':' · sin liquidar');
  if(p.origen==='qr')return '🔲 Mercado Pago';
  return p.entregadoPor||p.creadoPor||'—';
}

  try{
    const me=await API.get('/api/me');app.rol=me.rol;app.tenant=me.tenant;app.username=me.username;app.row=me.row;
    // Multi-tenant: cada restaurante ve su propio nombre en la pestaña

    else if(!app.sucursalId)app.sucursalId=app.miSucursal||app.sucursales[0].id;

}

function renderComandaOffline(){
  const o=app._off;const cats=Object.values(app.menu.categorias).sort((a,b)=>(a.orden||0)-(b.orden||0));
  const prods=Object.values(app.menu.productos).filter(p=>p.activo&&p.disponible!==false&&p.categoriaId===o.cat);
  const total=o.lineas.reduce((s,l)=>s+l.precioBase*l.cantidad,0);
  $('#view').innerHTML=`<div class="panel" style="border-color:var(--accent)"><h3>Comanda offline <span class="small">se guarda en este equipo y se envía a cocina al reconectar</span></h3>
    <div class="small" style="color:var(--muted);margin-bottom:8px">Offline solo captura productos a precio base (sin modificadores) y como mostrador: un domicilio necesita dirección validada. Anota el detalle en la nota.</div>
    <div class="cats">${cats.map(c=>`<button class="cat ${c.id===o.cat?'active':''}" data-ocat="${c.id}">${c.nombre}</button>`).join('')}</div>

  </div>
  <div class="panel"><h3>Pedido (${o.lineas.reduce((s,l)=>s+l.cantidad,0)} items · ${money(total)})</h3>
    ${o.lineas.length?o.lineas.map((l,i)=>`<div class="bar-row" style="align-items:center"><div class="bn" style="flex:1">${l.cantidad}× ${l.nombre}</div><div class="bv">${money(l.precioBase*l.cantidad)}</div><button class="btn" data-odec="${i}" style="padding:4px 9px;min-height:auto;margin-left:8px">−</button></div>`).join(''):'<div class="empty">Agrega productos.</div>'}
    <div class="field" style="margin-top:10px"><label>Nombre / mesa / nota</label><input id="offNota" value="${(o.cliente.nombre||'').replace(/"/g,'&quot;')}" placeholder="Ej. Mesa 4 / Juan / 2 grandes"></div>
    <button class="btn accent" id="offGuardar" ${o.lineas.length?'':'disabled'} style="width:100%">Guardar pedido offline</button>
  </div>`;
  document.querySelectorAll('[data-ocat]').forEach(b=>b.onclick=()=>{o.cat=b.dataset.ocat;renderComandaOffline();});
  document.querySelectorAll('[data-oadd]').forEach(b=>b.onclick=()=>{const p=app.menu.productos[b.dataset.oadd];const ex=o.lineas.find(l=>l.productoId===p.id);if(ex)ex.cantidad++;else o.lineas.push({productoId:p.id,nombre:p.nombre,precioBase:p.precioBase,cantidad:1});renderComandaOffline();});
  document.querySelectorAll('[data-odec]').forEach(b=>b.onclick=()=>{const i=+b.dataset.odec;o.lineas[i].cantidad--;if(o.lineas[i].cantidad<=0)o.lineas.splice(i,1);renderComandaOffline();});
  $('#offGuardar').onclick=()=>{
    if(!o.lineas.length)return;
    const nota=$('#offNota').value.trim();
    const cola=colaOffline();
    cola.push({sucursalId:app.sucursalId,tipoServicio:o.tipo,canalId:'local',cliente:nota?{nombre:nota}:{},lineas:o.lineas.map(l=>({productoId:l.productoId,cantidad:l.cantidad,notas:''})),creado:new Date().toISOString()});
    setColaOffline(cola);
    toast('✓ Pedido guardado offline',{tipo:'ok'});
    if(app.online)sincronizarOffline(true);
    abrirComandaOffline();
  };
}
async function sincronizarOffline(silencioso){
  if(!navigator.onLine||!API.token)return;
  const cola=colaOffline();if(!cola.length){if(!silencioso)toast('No hay pedidos offline');return;}
  if(!silencioso)toast('Sincronizando…');
  const quedan=[];let okN=0,errN=0;
  for(const o of cola){
    try{
      // Un domicilio guardado offline no trae direccion validada: entra como
      // mostrador y caja lo pasa a Reparto capturando los datos de entrega.
      const tipo=o.tipoServicio==='domicilio'?'mostrador':o.tipoServicio;
      const ped=await API.post('/api/pedidos',{sucursalId:o.sucursalId,tipoServicio:tipo,canalId:o.canalId||'local'});
      if(o.cliente&&o.cliente.nombre)await API.patch('/api/pedidos/'+ped.folio,{cliente:o.cliente});
      for(const l of o.lineas)await API.post('/api/pedidos/'+ped.folio+'/lineas',{productoId:l.productoId,cantidad:l.cantidad,notas:l.notas||''});
      await API.post('/api/pedidos/'+ped.folio+'/comanda');
      okN++;
    }catch(e){errN++;quedan.push(o);}
  }
  setColaOffline(quedan);
  toast(okN+' pedido(s) sincronizado(s)'+(errN?' · '+errN+' pendiente(s)':''),{tipo:okN?'ok':undefined,ms:4500});
  if(app.vista==='cocina')pintarCocina();else if(app.vista==='caja')vCaja();
}

function mesaNombre(id){return 'Mesa '+(app._mesaNum&&app._mesaNum[id]||'');}
function onSvc(s){
  if(s==='mesa'){toast('Elige una mesa en la pestaña Mesas');go('mesas');return;}
  if(app.pos.pedido&&app.pos.pedido.estado==='abierto'&&app.pos.pedido.lineas.length){toast('Cobra o vacía el pedido actual antes de cambiar');return;}
  if(app.pos.pedido&&app.pos.pedido.estado!=='abierto'){app.pos.folio=null;app.pos.pedido=null;app.pos.entrega=null;}
  if(s==='domicilio'){
    // El pedido a domicilio no se abre sin direccion: la moto necesita a donde ir.
    modalEntrega(app.pos.entrega,ent=>{
      app.pos.entrega=ent;app.pos.tipoServicio='domicilio';app.pos.folio=null;app.pos.pedido=null;closeModal();vPOS();
    });
    return;
  }
  app.pos.tipoServicio=s;app.pos.folio=null;app.pos.pedido=null;app.pos.entrega=null;vPOS();
}
async function onCanal(id){

async function asegurarPedido(){
  if(app.pos.pedido)return app.pos.pedido;
  const body={sucursalId:app.sucursalId,tipoServicio:app.pos.tipoServicio};
  if(app.pos.tipoServicio==='mesa')body.mesaId=app.pos.mesaId;
  else body.canalId=app.pos.canalId||'local';
  if(app.pos.tipoServicio==='domicilio'){
    if(!app.pos.entrega)throw new Error('Captura los datos de entrega antes de agregar productos');
    body.cliente=app.pos.entrega;

  const p=await API.post('/api/pedidos',body);app.pos.folio=p.folio;app.pos.pedido=p;return p;
}

function renderLines(){
  const ped=app.pos.pedido;const cont=$('#lines');if(!cont)return;
  if(!ped||!ped.lineas.length){cont.innerHTML=`<div class="empty">${app.turno?'Toca un producto para empezar.':'Abre el turno para vender.'}</div>`;}
  else cont.innerHTML=ped.lineas.map(l=>`<div class="line"><div style="flex:1"><div class="lname">${l.cantidad}× ${l.nombre}</div>${l.modificadores.length?`<div class="lmod">${l.modificadores.map(m=>m.opcionNombre+(m.precioDelta?` (+${money(m.precioDelta)})`:'')).join(' · ')}</div>`:''}${l.notas?`<div class="lnote">“${l.notas}”</div>`:''}</div><div class="lprice">${money(l.importe)}</div><button class="rm" data-rm="${l.id}">×</button></div>`).join('');
  cont.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{app.pos.pedido=await API.del(`/api/pedidos/${app.pos.folio}/lineas/${b.dataset.rm}`);renderLines();});
  const sub=ped?ped.subtotal:0,env=ped?ped.costoEnvio:0,tot=ped?ped.total:0;
  $('#tSub').textContent=money(sub);
  if($('#tEnvioRow')){$('#tEnvioRow').style.display=env?'flex':'none';$('#tEnvio').textContent=money(env);}
  if($('#tDescRow')){const d=ped&&ped.descuento;if(d){const amt=d.tipo==='porcentaje'?sub*d.valor/100:d.valor;$('#tDescRow').style.display='flex';$('#tDescLbl').textContent='Descuento'+(d.motivo?' · '+d.motivo:'');$('#tDesc').textContent='−'+money(amt);}else $('#tDescRow').style.display='none';}
  $('#tTotal').textContent=money(tot);
  const bc=$('#btnCobrar');if(bc&&app.pos.tipoServicio!=='mesa')bc.disabled=!(app.turno&&ped&&ped.lineas.length>0);
  const bs=$('#btnSeg');if(bs)bs.disabled=!(ped&&ped.folio);
  const bsc=$('#btnSegCopia');if(bsc)bsc.disabled=!(ped&&ped.folio);
}
function modalModificadores(prod){
  const grupos=prod.gruposIds.map(id=>app.menu.gruposModificadores[id]);
  let h=`<h3>${prod.nombre}</h3><div class="sub">Precio base ${money(prod.precioBase)}</div>`;
  grupos.forEach(g=>{h+=`<div class="grp" data-grp="${g.id}"><div class="glabel"><span>${g.nombre}</span>${g.obligatorio?'<span class="req">Obligatorio</span>':''}</div>`+
    g.opciones.filter(o=>o.activo).map(o=>{const ck=g.obligatorio&&g.tipo==='unico'&&o.porDefecto?'checked':'';const inp=g.tipo==='unico'?`<input type="radio" name="g_${g.id}" value="${o.id}" ${ck}>`:`<input type="checkbox" name="g_${g.id}" value="${o.id}">`;return `<label class="opt">${inp}<span class="onm">${o.nombre}</span>${o.precioDelta?`<span class="od">+${money(o.precioDelta)}</span>`:''}</label>`;}).join('')+`</div>`;});
  h+=`<div class="grp"><div class="glabel"><span>Notas para cocina</span></div><input class="nota" id="lnNota" placeholder="Ej. sin sal, extra dorada"></div>
     <div class="modal-foot"><button class="btn-ghost" id="mCancel">Cancelar</button><button class="btn-primary" id="mAdd">Agregar — <span id="mPrice">${money(prod.precioBase)}</span></button></div>`;
  modal.innerHTML=h;ov.classList.add('show');
  const rec=()=>{let d=0,ok=true;document.querySelectorAll('#modal .grp[data-grp]').forEach(gd=>{const g=app.menu.gruposModificadores[gd.dataset.grp];const ch=[...gd.querySelectorAll('input:checked')];ch.forEach(c=>d+=g.opciones.find(x=>x.id===c.value).precioDelta);if(g.obligatorio&&!ch.length)ok=false;if(g.max&&ch.length>g.max)ok=false;});$('#mPrice').textContent=money(prod.precioBase+d);$('#mAdd').disabled=!ok;};
  modal.querySelectorAll('input').forEach(i=>i.addEventListener('change',rec));rec();
  $('#mCancel').onclick=closeModal;
  $('#mAdd').onclick=async()=>{const mods=[];document.querySelectorAll('#modal .grp[data-grp]').forEach(gd=>{const g=app.menu.gruposModificadores[gd.dataset.grp];gd.querySelectorAll('input:checked').forEach(c=>mods.push({grupoId:g.id,opcionId:c.value}));});
    try{app.pos.pedido=await API.post(`/api/pedidos/${app.pos.folio}/lineas`,{productoId:prod.id,cantidad:1,modsElegidos:mods,notas:$('#lnNota').value.trim()});closeModal();renderLines();}catch(e){toast(e.message);}};
}
async function mandarComanda(){
  if(!app.pos.pedido||!app.pos.pedido.lineas.length){toast('Agrega productos primero');return;}
  const tipo=app.pos.tipoServicio;
  try{
    const r=await API.post(`/api/pedidos/${app.pos.folio}/comanda`);
    renderNav();
    if(!puedeCobrar()&&(tipo==='mostrador'||tipo==='domicilio')){
      // el mesero manda a cocina y deja la cuenta ABIERTA para que caja la cobre
      toast('✓ Enviado a cocina · caja lo cobrará',{tipo:'ok',ms:4500});
      app.pos={folio:null,pedido:null,tipoServicio:tipo,mesaId:null,cat:app.pos.cat};
      vPOS();
    }else{
      toast(r.enviadas?r.enviadas+' a cocina':'Nada nuevo que mandar');
    }
  }catch(e){toast(e.message);}
}
async function cargarCuentasAbiertasPOS(){
  if(!puedeCobrar())return;
  const cont=$('#cuentasAbiertas');if(!cont)return;
  let abiertos=[];try{abiertos=await API.get('/api/pedidos?estado=abierto&sucursalId='+app.sucursalId);}catch{return;}
  abiertos=abiertos.filter(p=>p.tipoServicio==='mostrador'&&p.lineas.length); // mesas: pestaña Mesas · domicilios asignados: pestaña Reparto
  if(!abiertos.length){cont.innerHTML='';return;}
  cont.innerHTML=`<div class="cuentas-strip"><span class="cs-lbl">Cuentas por cobrar (${abiertos.length}):</span>${abiertos.map(p=>`<button class="cs-chip" data-cobrarped="${p.folio}">${p.tipoServicio==='domicilio'?'🛵 Domicilio':'🧾 Mostrador'}${p.cliente&&p.cliente.nombre?' · '+p.cliente.nombre:''} · ${money(p.total)}</button>`).join('')}</div>`;
  cont.querySelectorAll('[data-cobrarped]').forEach(b=>b.onclick=()=>cobrarPedidoAbierto(b.dataset.cobrarped));
}
async function cobrarPedidoAbierto(folio){
  try{const p=await API.get('/api/pedidos/'+folio);
    if(!p.lineas.length){toast('El pedido no tiene productos');return;}
    if(enReparto(p)){toast('Ese pedido ya va con el repartidor — cóbralo en Reparto');go('reparto');return;}
    app.pos={folio:p.folio,pedido:p,tipoServicio:p.tipoServicio,mesaId:null,canalId:p.canalId,cat:app.pos.cat,entrega:p.cliente||null};
    vPOS();
  }catch(e){toast(e.message);}
}
async function aplicarPromocion(){
  if(!app.pos.pedido||!app.pos.pedido.lineas.length){toast('Agrega productos primero');return;}
  let promos=[];try{promos=(await API.get('/api/promociones')).filter(p=>p.activo);}catch{}
  modal.innerHTML=`<h3>Aplicar promoción</h3><div class="sub">Se descuenta del total de este pedido</div>
    ${promos.length?promos.map(p=>`<button class="opt" data-p="${p.id}" style="width:100%;justify-content:space-between" data-tipo="${p.tipo}" data-valor="${p.valor}" data-nom="${p.nombre}"><span class="onm">${p.nombre}</span><span class="od">${p.tipo==='porcentaje'?p.valor+'%':money(p.valor)}</span></button>`).join(''):'<div class="empty">No hay promociones activas. Créalas en la pestaña Promociones.</div>'}
    <div class="modal-foot">${app.pos.pedido.descuento?'<button class="btn-ghost" id="quitarP">Quitar promoción</button>':''}<button class="btn-ghost" id="pClose">Cerrar</button></div>`;
  ov.classList.add('show');
  $('#pClose').onclick=closeModal;
  if($('#quitarP'))$('#quitarP').onclick=async()=>{app.pos.pedido=await API.patch(`/api/pedidos/${app.pos.folio}`,{descuento:null});closeModal();renderLines();toast('Promoción quitada');};
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{
    app.pos.pedido=await API.patch(`/api/pedidos/${app.pos.folio}`,{descuento:{tipo:b.dataset.tipo,valor:+b.dataset.valor,motivo:b.dataset.nom}});
    closeModal();renderLines();toast('Promoción aplicada');
  });
}
function cobrar(){
  const ped=app.pos.pedido;if(!ped||!ped.lineas.length){toast('Agrega productos');return;}
  const canal=(app.canales||[]).find(c=>c.id===ped.canalId);
  const metodos=canal&&canal.esApp?['plataforma','tarjeta','efectivo']:['efectivo','tarjeta','transferencia'];
  const nm={plataforma:'Plataforma',efectivo:'Efectivo',tarjeta:'Tarjeta',transferencia:'Transferencia'};
  const r2c=n=>Math.round(n*100)/100;
  let metodo=metodos[0];let tipPct=0;let tipMonto=0;
  const propina=()=>tipPct!=null?r2c(ped.total*tipPct/100):r2c(tipMonto||0);
  const totalCon=()=>r2c(ped.total+propina());
  const render=()=>{
    const pr=propina(),tc=totalCon();
    modal.innerHTML=`<h3 id="cobTit">Cobrar ${money(tc)}</h3><div class="sub" id="cobSub">${ped.folio}${canal&&canal.esApp?' · '+canal.nombre:''}${pr>0?' · propina '+money(pr):''}</div>
      <div class="paytabs">${metodos.map(m=>`<button data-m="${m}" class="${m===metodo?'active':''}">${nm[m]}</button>`).join('')}</div>
      ${metodo!=='plataforma'?`<button class="lnk-split" id="btnDividir">Dividir cuenta entre varios pagos</button>`:''}
      ${metodo!=='plataforma'?`<div class="field"><label>Propina (va completa al personal · no es venta)</label><div class="tip-row">${[0,10,15,20].map(p=>`<button class="tip-btn ${tipPct===p?'active':''}" data-tip="${p}">${p===0?'Sin':p+'%'}</button>`).join('')}<input id="tipC" type="number" class="mono" placeholder="$ otra" value="${tipPct==null?tipMonto:''}"></div></div>`:''}
      ${metodo==='efectivo'?`<div class="field"><label>Efectivo recibido</label><input id="recib" type="number" class="mono" placeholder="${tc}"></div><div class="cambio" id="cambio"></div>`:`<div class="bignum">${money(tc)}</div>${metodo==='plataforma'?'<div class="sub" style="text-align:center">El cobro lo hace la plataforma; aquí solo se registra la venta.</div>':''}`}
      <div class="modal-foot"><button class="btn-ghost" id="pCancel">Cancelar</button><button class="btn-primary" id="pOk">Confirmar cobro</button></div>`;
    const actualizaCambio=()=>{const ri=$('#recib');if(!ri)return;const r=+ri.value||0,t=totalCon(),c=r-t;$('#cambio').textContent=r>0?(c>=0?'Cambio: '+money(c):'Faltan '+money(-c)):'';$('#cambio').style.color=c<0?'var(--red)':'var(--green)';};
    modal.querySelectorAll('.paytabs button').forEach(b=>b.onclick=()=>{metodo=b.dataset.m;render();});
    if($('#btnDividir'))$('#btnDividir').onclick=()=>modalDividir(ped);
    modal.querySelectorAll('[data-tip]').forEach(b=>b.onclick=()=>{tipPct=+b.dataset.tip;tipMonto=0;render();});
    const tcInp=$('#tipC');if(tcInp)tcInp.oninput=()=>{tipPct=null;tipMonto=+tcInp.value||0;const t=totalCon();$('#cobTit').textContent='Cobrar '+money(t);$('#cobSub').textContent=ped.folio+(propina()>0?' · propina '+money(propina()):'');const ri=$('#recib');if(ri)ri.placeholder=t;const bn=modal.querySelector('.bignum');if(bn)bn.textContent=money(t);actualizaCambio();};
    if(metodo==='efectivo'){const ri=$('#recib');ri.addEventListener('input',actualizaCambio);setTimeout(()=>ri.focus(),50);}
    $('#pCancel').onclick=closeModal;
    $('#pOk').onclick=async()=>{const pr=propina(),tc=totalCon();let recibido=0,pagos;
      if(metodo==='efectivo'){recibido=+($('#recib').value)||tc;if(recibido<tc){toast('El efectivo no alcanza');return;}pagos=[{metodo:'efectivo',monto:ped.total}];}
      else pagos=[{metodo,monto:ped.total}];
      const propinaObj=pr>0?{monto:pr,metodo}:null;
      try{const p=await API.post(`/api/pedidos/${ped.folio}/cobrar`,{pagos,recibido,propina:propinaObj});closeModal();ticketFinal(p);
        const wasMesa=app.pos.tipoServicio==='mesa';app.pos={folio:null,pedido:null,tipoServicio:wasMesa?'mostrador':app.pos.tipoServicio,mesaId:null,cat:app.pos.cat};renderNav();
      }catch(e){toast(e.message);}};
  };
  render();ov.classList.add('show');
}
function modalDividir(ped){
  let n=2;const r2c=v=>Math.round(v*100)/100;
  const render=()=>{
    const base=Math.floor(ped.total/n*100)/100;
    const montos=Array.from({length:n},(_,i)=>i===n-1?r2c(ped.total-base*(n-1)):base);
    modal.innerHTML=`<h3>Dividir ${money(ped.total)}</h3><div class="sub">${ped.folio} · cada quien paga su parte</div>
      <div class="field"><label>¿En cuántas partes?</label><div class="tip-row">${[2,3,4,5,6].map(k=>`<button class="tip-btn ${k===n?'active':''}" data-n="${k}">${k}</button>`).join('')}</div></div>
      <div id="splitRows">${montos.map((mo,i)=>`<div class="cols2" style="margin-bottom:6px;align-items:center"><select class="splMet" data-i="${i}"><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option><option value="transferencia">Transfer.</option></select><input class="splMon mono" data-i="${i}" type="number" value="${mo}"></div>`).join('')}</div>
      <div id="splitSum" class="sub" style="font-weight:600"></div>
      <div class="modal-foot"><button class="btn-ghost" id="dvBack">Volver</button><button class="btn-primary" id="dvOk">Cobrar dividido</button></div>`;
    modal.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{n=+b.dataset.n;render();});
    const sum=()=>Array.from(modal.querySelectorAll('.splMon')).reduce((s,el)=>s+(+el.value||0),0);
    const upd=()=>{const s=r2c(sum());const ok=Math.abs(s-ped.total)<0.01;$('#splitSum').textContent=`Suma: ${money(s)} / ${money(ped.total)}`;$('#splitSum').style.color=ok?'var(--green)':'var(--red)';};
    modal.querySelectorAll('.splMon').forEach(el=>el.oninput=upd);upd();
    $('#dvBack').onclick=()=>cobrar();
    $('#dvOk').onclick=async()=>{
      const pagos=Array.from(modal.querySelectorAll('.splMon')).map((el,i)=>({metodo:modal.querySelector('.splMet[data-i="'+i+'"]').value,monto:r2c(+el.value||0)})).filter(p=>p.monto>0);
      const s=pagos.reduce((a,p)=>a+p.monto,0);
      if(Math.abs(s-ped.total)>0.01){toast('La suma debe ser igual al total');return;}
      const recibido=pagos.filter(p=>p.metodo==='efectivo').reduce((a,p)=>a+p.monto,0);
      try{const p=await API.post(`/api/pedidos/${ped.folio}/cobrar`,{pagos,recibido});closeModal();ticketFinal(p);
        const wasMesa=app.pos.tipoServicio==='mesa';app.pos={folio:null,pedido:null,tipoServicio:wasMesa?'mostrador':app.pos.tipoServicio,mesaId:null,cat:app.pos.cat};renderNav();
      }catch(e){toast(e.message);}
    };
  };
  render();ov.classList.add('show');
}
function ticketHTML(p){

  const canal=(app.canales||[]).find(c=>c.id===p.canalId);

  const fecha=new Date(p.actualizado||p.creado).toLocaleString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const desc=p.descuento?(p.descuento.tipo==='porcentaje'?p.subtotal*p.descuento.valor/100:p.descuento.valor):0;
  const servicio=p.tipoServicio==='mesa'?('Mesa '+(app._mesaNum&&app._mesaNum[p.mesaId]||'')):p.tipoServicio;
  const head=app.tenant&&app.tenant.logo?`<img src="${app.tenant.logo}" style="max-width:150px;max-height:64px;display:block;margin:0 auto 6px">`:`<div class="nm">${(app.tenant&&app.tenant.nombre)||'Restaurante'}</div>`;
  return `<!doctype html><html><head><meta charset="utf-8"><title>${p.folio}</title><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Courier New',monospace;width:280px;margin:0 auto;padding:10px;color:#000;font-size:12px;line-height:1.35}
  .nm{font-size:18px;font-weight:bold;text-align:center}
  .c{text-align:center}.muted{color:#444}
  hr{border:none;border-top:1px dashed #000;margin:6px 0}
  .row{display:flex;justify-content:space-between;gap:8px}
  .it{margin:3px 0}.mod{font-size:11px;color:#333;padding-left:12px}
  .tot{font-size:15px;font-weight:bold;margin:2px 0}
  .gr{text-align:center;margin-top:10px;font-size:11px}
  @media print{body{width:auto}}
  </style></head><body>
  ${head}
  <div class="c muted">${suc}</div><hr>
  <div class="row"><span>${p.folio}</span><span>${servicio}</span></div>
  <div class="muted">${fecha}</div>
  ${canal&&canal.esApp?`<div class="muted">Canal: ${canal.nombre}</div>`:''}
  ${p.cliente&&p.cliente.nombre?`<div class="muted">Cliente: ${p.cliente.nombre}</div>`:''}
  <hr>
  ${p.lineas.map(l=>`<div class="it"><div class="row"><span>${l.cantidad}× ${l.nombre}</span><span>${money(l.importe)}</span></div>${(l.modificadores||[]).map(m=>`<div class="mod">+ ${m.opcionNombre}</div>`).join('')}${l.notas?`<div class="mod">Nota: ${l.notas}</div>`:''}</div>`).join('')}
  <hr>
  <div class="row"><span>Subtotal</span><span>${money(p.subtotal)}</span></div>
  ${desc?`<div class="row"><span>Descuento${p.descuento&&p.descuento.motivo?' ('+p.descuento.motivo+')':''}</span><span>-${money(desc)}</span></div>`:''}
  ${p.costoEnvio?`<div class="row"><span>Envío</span><span>${money(p.costoEnvio)}</span></div>`:''}
  <div class="row tot"><span>TOTAL</span><span>${money(p.total)}</span></div>
  ${(()=>{const iva=ivaTasa();if(!iva)return '';const base=Math.round(p.total/(1+iva/100)*100)/100;const imp=Math.round((p.total-base)*100)/100;return `<div class="row" style="font-size:11px"><span>Base gravable</span><span>${money(base)}</span></div><div class="row" style="font-size:11px"><span>IVA ${iva}% (incluido)</span><span>${money(imp)}</span></div>`;})()}
  ${p.propina&&p.propina.monto?`<div class="row"><span>Propina (${nm[p.propina.metodo]||p.propina.metodo})</span><span>${money(p.propina.monto)}</span></div><div class="row tot"><span>TOTAL + PROPINA</span><span>${money(p.total+p.propina.monto)}</span></div>`:''}<hr>
  <div class="row"><span>Pago</span><span>${nm[p.pago.metodo]||p.pago.metodo}</span></div>
  ${p.pago.metodo==='efectivo'&&p.pago.recibido?`<div class="row"><span>Recibido</span><span>${money(p.pago.recibido)}</span></div><div class="row"><span>Cambio</span><span>${money(p.pago.cambio||0)}</span></div>`:''}
  <div class="gr">¡Gracias por su compra!<br>${(app.tenant&&app.tenant.nombre)||''}</div>
  </body></html>`;
}
function imprimirTicket(p){
  const w=window.open('','ticketwin','width=340,height=640');
  if(!w){toast('Permite ventanas emergentes para imprimir el ticket');return;}
  w.document.write(ticketHTML(p));w.document.close();
  setTimeout(()=>{try{w.focus();w.print();}catch(e){}},350);
}
function ticketFinal(p){
  modal.innerHTML=`<h3>${p.folio}</h3><div class="sub">${p.tipoServicio} · cobrado</div>
    <div class="breakdown">${p.lineas.map(l=>`<div class="b"><span>${l.cantidad}× ${l.nombre}</span><span>${money(l.importe)}</span></div>`).join('')}${p.costoEnvio?`<div class="b"><span>Envío</span><span>${money(p.costoEnvio)}</span></div>`:''}<div class="b hl"><span>Total</span><span>${money(p.total)}</span></div>${p.propina&&p.propina.monto?`<div class="b"><span>Propina</span><span>${money(p.propina.monto)}</span></div>`:''}<div class="b"><span>Pago (${p.pago.metodo})</span><span>${money(p.pago.recibido||p.total)}</span></div>${p.pago.cambio?`<div class="b"><span>Cambio</span><span>${money(p.pago.cambio)}</span></div>`:''}</div>
    <div class="modal-foot"><button class="btn-ghost" id="okPrint">🖨 Imprimir ticket</button><button class="btn-primary" id="okDone">Listo</button></div>`;
  ov.classList.add('show');
  $('#okPrint').onclick=()=>imprimirTicket(p);
  $('#okDone').onclick=()=>{closeModal();if(app.vista==='caja')vCaja();else if(app.vista==='pos')vPOS();else if(app.vista==='mesas')vMesas();};
}

// ===========================================================================
//  REPARTO — despacho de motos propias
//  Ciclo: por asignar -> asignado -> en ruta -> entregado (cobra el motorista)
//  -> liquidación en caja. El efectivo no entra al turno hasta que liquida.
// ===========================================================================
async function vReparto(){
  const suc=app.sucursalId;
  const [tab,reps]=await Promise.all([
    API.get('/api/reparto?sucursalId='+encodeURIComponent(suc)),
    API.get('/api/reparto/repartidores?sucursalId='+encodeURIComponent(suc))
  ]);
  app._rep={tab,reps};
  pintarReparto();
  if(kdsTimer){clearInterval(kdsTimer);}
  kdsTimer=setInterval(async()=>{
    if(app.vista!=='reparto'){clearInterval(kdsTimer);kdsTimer=null;return;}
    if(ov.classList.contains('show'))return; // no refrescar con un modal abierto
    try{
      const [t,r]=await Promise.all([
        API.get('/api/reparto?sucursalId='+encodeURIComponent(app.sucursalId)),
        API.get('/api/reparto/repartidores?sucursalId='+encodeURIComponent(app.sucursalId))
      ]);
      app._rep={tab:t,reps:r};pintarReparto();
    }catch{}
  },20000);
}
function pintarReparto(){

function estrellasTxt(n){return n?'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n)):'';}
// Abrir la navegación del teléfono. Si ya conocemos las coordenadas del
// domicilio se usan (exactas); si no, se manda la dirección escrita.
// La DIRECCIÓN ESCRITA manda. Google sabe rutear direcciones mucho mejor de lo
// que nosotros sabemos adivinar coordenadas, y una coordenada mal aprendida
// manda al repartidor al lugar equivocado con toda confianza.
// Solo se usan coordenadas cuando una entrega real ya las confirmó.
function urlComoLlegar(p){
  const c=p.cliente||{};const r=p.reparto||{};
  const dir=[c.calle,c.numero,c.colonia].filter(Boolean).join(', ')||c.direccion||'';
  if(dir)return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dir)}&travelmode=driving`;
  if(r.destino&&r.destino.lat!=null)
    return `https://www.google.com/maps/dir/?api=1&destination=${r.destino.lat},${r.destino.lng}&travelmode=driving`;
  return null;
}
